function fresh(x,days){return x&&(new Date()-new Date(x+'T00:00:00'))/86400000<=days}function val(p){let v=lastV(p.id),q=lastQ(p.id);if(account(p))return Number(v?.valor_total||0);if(v&&fresh(v.fecha,45))return Number(v.valor_total||0);if(q&&fresh(q.fecha,10)&&qty(p.id))return Number(q.cierre||0)*qty(p.id)*Number(q.factor_conversion||1);return 0}function oldVal(p){let h=histV(p.id);return h[1]?Number(h[1].valor_total||0):0}function diff(p){return val(p)-oldVal(p)}function pct(p){let o=oldVal(p);return o?diff(p)/o*100:0}

function entities(){let g=groups();return '<div class="card"><div class="toolbar"><h2>Entidades</h2><button class="btn" onclick="manualData()">＋ Introducir datos</button></div><input class="search" placeholder="Buscar producto" value="'+esc(S.search)+'" oninput="S.search=this.value;render()">'+Object.entries(g).map(([id,ps])=>{let e=S.e.find(x=>x.id===id),open=S.open[id],f=S.search?ps.filter(p=>(p.nombre+' '+tn(p)).toLowerCase().includes(S.search.toLowerCase())):ps;return `<div class="entity"><div class="entity-head" onclick="S.open['${id}']=!S.open['${id}'];render()"><div><div class="entity-name">${open?'▾':'▸'} ${esc(e?.nombre||'Sin entidad')}</div><div class="sub">${ps.length} productos · ${e?.entidad_maestra_id?'✓ Verificada':'Pendiente de verificar'}</div></div><div class="entity-total">${money(ps.reduce((a,p)=>a+val(p),0))}</div></div>${open?'<div class="entity-body">'+productRows(f)+'</div>':''}</div>`}).join('')+'</div>'}

function chart(){let a=active().map(p=>({p,d:diff(p)})).filter(x=>x.d);if(!a.length)return '<div class="sub">Aún no hay suficientes puntos comparables.</div>';let mx=Math.max(...a.map(x=>Math.abs(x.d)))||1;return '<div class="chart">'+a.map(x=>`<div class="bar ${x.d>=0?'up':'down'}" style="height:${Math.max(8,Math.abs(x.d)/mx*100)}%" title="${esc(x.p.nombre)}: ${money(x.d)}"></div>`).join('')+'</div>'}

function product(id){let p=S.p.find(x=>x.id===id),q=lastQ(id),vh=histV(id),qh=histQ(id);S.context=id;modalBox.innerHTML=`<div class="toolbar"><h2>${esc(p.nombre)}</h2><button class="btn alt" onclick="closeM()">Cerrar</button></div><div class="sub">${esc(en(p))} · ${esc(tn(p))}</div><div class="toolbar" style="margin:15px 0"><button class="btn" onclick="manualData('${id}')">＋ Introducir datos</button><button class="btn alt" onclick="capture('${id}')">📎 Captura / PDF / Word / Excel</button>${account(p)?'':'<button class="btn alt" onclick="operationForm(\''+id+'\')">＋ Operación</button>'}${p.activo!==false?'<button class="btn red" onclick="deactivate(\''+id+'\')">Pasar a inactivos</button>':''}</div>${account(p)?accountHistory(p,vh):`<div class="card"><b>Posición:</b> ${num(qty(id))} · <b>Valor:</b> ${money(val(p))}</div>`}<div class="card"><h3>Histórico de cotizaciones / valoraciones</h3>${quoteHistory(id,qh,vh)}</div><div class="card"><h3>Operaciones</h3>${opsHistory(id)}</div>`;modal.classList.add('open')}

function quoteHistory(id,qh,vh){let rows=qh.map(q=>({fecha:q.fecha,cot:q.cierre,total:q.cierre*qty(id),origen:'Cotización'}));if(!rows.length)rows=vh.map(v=>({fecha:v.fecha,cot:v.precio_unitario,total:v.valor_total,origen:v.origen||'Valoración'}));else{let vm=new Map(vh.map(v=>[v.fecha,v]));rows=rows.map(r=>vm.has(r.fecha)?{...r,total:vm.get(r.fecha).valor_total}:r)}return rows.length?'<table class="history"><thead><tr><th>Fecha</th><th>Cotización/valor</th><th>Total</th><th>Origen</th></tr></thead><tbody>'+rows.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).map(r=>`<tr><td>${date(r.fecha)}</td><td>${r.cot==null?'—':num(r.cot)+' €'}</td><td>${r.total==null?'—':money(r.total)}</td><td>${esc(r.origen)}</td></tr>`).join('')+'</tbody></table>':'<div class="sub">Sin histórico.</div>'}
function opsHistory(id){let a=S.o.filter(x=>x.producto_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));return a.length?'<table class="history"><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Precio</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${date(x.fecha)}</td><td>${esc(x.tipo_operacion)}</td><td>${num(x.cantidad)}</td><td>${money(x.precio_unitario)}</td></tr>`).join('')+'</tbody></table>':'<div class="sub">Sin operaciones.</div>'}

function operationForm(id){modalBox.innerHTML=`<h2>Nueva operación</h2><div class="form"><label>Producto<select id="opP">${S.p.filter(x=>x.activo!==false).map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="opF" type="date" value="${today()}"></label><label>Tipo<select id="opT"><option>Compra</option><option>Venta</option><option>Aportación</option><option>Dividendo en acciones</option><option>Acciones liberadas</option><option>Split</option><option>Traspaso</option><option>Ajuste de posición</option><option>Dividendo en efectivo</option><option>Prima de emisión</option><option>Venta de derechos</option></select></label><label>Cantidad<input id="opQ" type="number" step="0.00000001"></label><label>Precio unitario<input id="opPrc" type="number" step="0.00000001"></label><label>Importe neto<input id="opN" type="number" step="0.01"></label><label class="full">Observaciones<textarea id="opO"></textarea></label></div><br><button class="btn" onclick="saveOp()">Guardar</button> <button class="btn alt" onclick="closeM()">Cancelar</button>`;modal.classList.add('open')}
async function saveOp(){let r=await db.from('operaciones').insert({user_id:S.user.id,producto_id:opP.value,fecha:opF.value,tipo_operacion:opT.value,cantidad:Number(opQ.value)||0,precio_unitario:Number(opPrc.value)||0,importe_neto:Number(opN.value)||0,moneda:'EUR',observaciones:opO.value});if(r.error)alert(r.error.message);else{closeM();load()}}
function interestForm(){modalBox.innerHTML=`<h2>Añadir interés</h2><div class="form"><label>Cuenta<select id="ip">${S.p.filter(account).map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="if" type="date" value="${today()}"></label><label>Bruto<input id="ib" type="number" step="0.01"></label><label>Retención<input id="ir" type="number" step="0.01"></label><label>Neto<input id="in" type="number" step="0.01"></label><label class="full">Observaciones<textarea id="io"></textarea></label></div><br><button class="btn" onclick="saveInterest()">Guardar</button>`;modal.classList.add('open')}
async function saveInterest(){let b=Number(ib.value)||0,r=Number(ir.value)||0,n=in.value===''?b-r:Number(in.value);let x=await db.from('intereses_cuentas').insert({user_id:S.user.id,producto_id:ip.value,fecha:if.value,importe_bruto:b,retencion:r,importe_neto:n,moneda:'EUR',origen:'Manual',observaciones:io.value});if(x.error)alert(x.error.message);else{closeM();load()}}
function capture(id){modalBox.innerHTML=`<h2>📎 Añadir documento</h2><div class="sub">Puedes adjuntar una captura de pantalla, PDF, Word o Excel. El archivo se conservará asociado al producto.</div><div class="form"><label>Producto<select id="cp">${S.p.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="cf" type="date" value="${today()}"></label><label class="full">Archivo<input id="file" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv"></label><label class="full">Observaciones<textarea id="co"></textarea></label></div><br><button class="btn" onclick="saveCapture()">Guardar documento</button>`;modal.classList.add('open')}
async function saveCapture(){let f=file.files[0];if(!f)return alert('Selecciona un archivo.');let path=S.user.id+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let u=await db.storage.from('patrimonio-documentos').upload(path,f);if(u.error)return alert(u.error.message);let r=await db.from('documentos_capturas').insert({user_id:S.user.id,producto_id:cp.value,fecha_documento:cf.value,archivo_nombre:f.name,archivo_tipo:f.type,archivo_path:path,estado:'pendiente_revision',datos_detectados:{},datos_confirmados:{},observaciones:co.value});if(r.error)return alert(r.error.message);closeM();load()}
async function activate(id){let r=await db.from('productos').update({activo:true}).eq('id',id).eq('user_id',S.user.id);if(r.error)alert(r.error.message);else load()}async function deactivate(id){if(!confirm('¿Pasar este producto a Inactivos?'))return;let r=await db.from('productos').update({activo:false}).eq('id',id).eq('user_id',S.user.id);if(r.error)alert(r.error.message);else{closeM();load()}}function closeM(){modal.classList.remove('open')}
load().catch(e=>{app.innerHTML='<div class="wrap"><div class="card error"><h2>Error</h2>'+esc(e.message||e)+'<br><button class="btn" onclick="load()">Reintentar</button></div></div>'});</script></body></html>
