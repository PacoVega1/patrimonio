/* Al recargar Patrimonio, comenzar siempre desde la cabecera.
   Evita que el navegador restaure la posición de desplazamiento anterior. */
(function(){
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  function goToTop(){window.scrollTo({top:0,left:0,behavior:'instant'});}
  window.addEventListener('pageshow',goToTop);
  window.addEventListener('load',goToTop,{once:true});
})();

.entity-head-new{grid-template-columns:minmax(250px,1fr) minmax(0,auto);align-items:center}

.entity-title-wrap{grid-column:1;grid-row:1;min-width:0;display:flex;align-items:center;gap:12px}
.entity-head-content{grid-column:2;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0;width:100%}
.entity-head-new .category-totals{flex:1 1 auto!important;min-width:0;gap:clamp(10px,1.25vw,18px)!important;justify-content:space-between!important;flex-wrap:nowrap!important}
.entity-head-new .category-metric{min-width:0}
.entity-body{grid-column:1/-1;grid-row:2;width:100%;min-width:0;display:block!important;clear:both}
.entity-head-new+.entity-body{width:100%}
