<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrimonio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>:root{--b:#214889;--b2:#3269c9;--bg:#f4f6fb;--c:#fff;--t:#14213d;--m:#71809b;--l:#dfe5ef;--g:#198754;--r:#c0392b;--w:#765c13}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--t)}.wrap{max-width:1380px;margin:auto;padding:24px}.top,.entity-head,.product,.row{display:flex;justify-content:space-between;gap:15px}.top{align-items:center}.brand h1{margin:0;font-size:34px}.brand p,.meta,.muted{color:var(--m)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--b);color:#fff}.btn.secondary{background:#fff;color:var(--b);border:1px solid var(--l)}.btn.danger{background:#fff0ef;color:var(--r)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--l);background:#fff;border-radius:28px;padding:11px 17px;font-weight:800;cursor:pointer}.tab.active{background:var(--b);color:#fff}.hero{background:linear-gradient(135deg,#204784,#3269c9);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.total{font-size:48px;font-weight:900;margin:5px 0 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#ffffff24;padding:15px;border-radius:14px}.stat b{display:block;font-size:21px;margin-top:5px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 5px 18px #14213d0a;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:260px;padding:12px 15px;border:1px solid var(--l);border-radius:12px;background:#fff}.row{align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.entity-head{align-items:center;padding:17px 8px;border-bottom:1px solid var(--l);cursor:pointer}.entity-head:hover{background:#f7f9fd}.entity-name{font-size:20px;font-weight:850}.entity-total{font-size:20px;font-weight:900;white-space:nowrap}.entity-products{padding:0 0 12px 20px}.product{align-items:center;padding:15px 0;border-bottom:1px solid var(--l);cursor:pointer}.product .name{font-weight:850}.value{font-weight:900;font-size:19px;text-align:right;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3ff;color:#2459b0;font-size:12px;font-weight:800;margin:2px}.ok{background:#eaf7ef;color:#176b42}.warn{background:#fff7df;color:var(--w)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--l);font-size:14px}th{color:var(--m)}.modal{position:fixed;inset:0;background:#0a142080;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:950px;width:100%;max-height:92vh;overflow:auto;padding:22px}.empty{text-align:center;padding:30px;color:var(--m)}.notice{padding:14px;border-radius:12px;background:#fff7df;color:var(--w);margin:12px 0}.error{background:#fff0ef;color:#9c2c20;padding:12px;border-radius:10px}.section{margin-top:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-weight:700;font-size:13px}.form input,.form select,.form textarea{width:100%;margin-top:5px;padding:11px;border:1px solid var(--l);border-radius:10px;background:#fff}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.conflict{border:1px solid #e7c65c;background:#fff9df;padding:16px;border-radius:14px;margin-bottom:18px}.file{border:2px dashed var(--l);padding:20px;text-align:center;border-radius:14px}.small{font-size:12px}.inactive{opacity:.85}@media(max-width:850px){.stats,.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:14px}.stats,.grid{grid-template-columns:1fr}.total{font-size:38px}.entity-head,.product{display:block}.value{margin-top:8px;text-align:left}}</style></head><body><div id="app"></div><div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div></div></div><script>
const SUPABASE_URL="https://rnwtvkhnhybdgxhmgebw.supabase.co",SUPABASE_KEY="sb_publishable_r00Qvz_GBmRi4fVj6O7scA_jIj9wuyN",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,products:[],entities:[],types:[],ops:[],valuations:[],quotes:[],sources:[],masterEntities:[],masterProducts:[],captures:[],tab:"entidades",search:"",expanded:{}};
const money=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n)||0),dateES=d=>d?new Intl.DateTimeFormat("es-ES").format(new Date(d+"T00:00:00")):"—",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const today=()=>new Date().toISOString().slice(0,10), typeName=p=>state.types.find(t=>t.id===p.tipo_producto_id)?.nombre||"Sin categoría", entityName=p=>state.entities.find(e=>e.id===p.entidad_financiera_id)?.nombre||"Sin entidad", isAccount=p=>["Cuenta corriente","Cuenta de ahorro","Cuenta de inversión"].includes(typeName(p));
const POSITION_TYPES=new Set(["Compra","Aportacion","Acciones liberadas","Dividendo en acciones","Split"]);function qtyDelta(o){let t=o.tipo_operacion||"",n=Number(o.cantidad||0);if(POSITION_TYPES.has(t))return Math.abs(n);if(t==="Venta")return -Math.abs(n);if(t==="Ajuste de posición"||t==="Traspaso")return n;return 0}function qtyFor(id){return state.ops.filter(o=>o.producto_id===id).reduce((s,o)=>s+qtyDelta(o),0)}
function latest(a,key){let m={};for(const x of a){if(!x.fecha||String(x.fecha)>today())continue;if(!m[x[key]]||String(x.fecha)>String(m[x[key]].fecha))m[x[key]]=x}return m}function latestVal(id){let vals=state.valuations.filter(v=>v.producto_id===id&&String(v.fecha)<=today());let valid=vals.filter(v=>v.es_valida);return valid.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||String(b.created_at).localeCompare(String(a.created_at)))[0]||latest(vals,"producto_id")[id]}function latestQuote(id){return latest(state.quotes,"producto_id")[id]}function fresh(d,n){if(!d)return false;let x=new Date(d+"T00:00:00"),now=new Date();return x<=now&&((now-x)/86400000)<=n}
function value(p){let v=latestVal(p.id);if(isAccount(p))return v?.valor_total!=null?Number(v.valor_total):0;if(v?.valor_total!=null&&fresh(v.fecha,45))return Number(v.valor_total);let q=latestQuote(p.id),qty=qtyFor(p.id);return q?.cierre!=null&&fresh(q.fecha,10)&&qty?Number(q.cierre)*qty*Number(q.factor_conversion||1):0}
function status(p){let v=latestVal(p.id),q=latestQuote(p.id);if(isAccount(p))return v?`saldo ${dateES(v.fecha)}`:"sin saldo";if(v&&fresh(v.fecha,45))return `valoración ${dateES(v.fecha)}`;if(q&&fresh(q.fecha,10))return `cotización ${dateES(q.fecha)}`;return q?`cotización antigua ${dateES(q.fecha)}`:v?`valoración antigua ${dateES(v.fecha)}`:"sin valoración actual"}function badge(p){let v=latestVal(p.id),q=latestQuote(p.id);if(isAccount(p))return v?`<span class="badge ok">Saldo ${dateES(v.fecha)}</span>`:`<span class="badge warn">Sin saldo</span>`;if(v&&fresh(v.fecha,45))return `<span class="badge ok">Valoración ${dateES(v.fecha)}</span>`;if(q&&fresh(q.fecha,10))return `<span class="badge ok">Cotización ${dateES(q.fecha)}</span>`;return `<span class="badge warn">Sin valoración actual</span>`}
async function pagedQuotes(){let all=[],from=0,step=1000;while(true){let {data,error}=await db.from("cotizaciones_historicas").select("*").order("fecha",{ascending:false}).range(from,from+step-1);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<step)break;from+=step}return all}
async function load(){let {data:{user},error}=await db.auth.getUser();if(error)throw error;state.user=user;if(!user){loginView();return}let results=await Promise.all([db.from("productos").select("*").eq("user_id",user.id),db.from("entidades_financieras").select("*").eq("user_id",user.id),db.from("tipos_productos").select("*").order("orden_presentacion"),db.from("operaciones").select("*").eq("user_id",user.id).order("fecha"),db.from("valoraciones_historicas").select("*").eq("user_id",user.id).order("fecha"),pagedQuotes(),db.from("fuentes_valoracion").select("*").order("puntuacion",{ascending:false}),db.from("entidades_maestras").select("*").eq("activo",true).order("nombre"),db.from("productos_maestros").select("*").eq("activo",true).order("nombre"),db.from("documentos_capturas").select("*").eq("user_id",user.id).order("created_at",{ascending:false})]);let names=["products","entities","types","ops","valuations","quotes","sources","masterEntities","masterProducts","captures"];for(let i=0;i<results.length;i++){if(results[i].error)throw results[i].error;state[names[i]]=results[i].data||results[i]||[]}render()}
function loginView(){app.innerHTML=`<div class="wrap"><div class="card" style="max-width:420px;margin:100px auto"><h1>Patrimonio</h1><div class="form"><label class="full">Email<input id="email" type="email"></label><label class="full">Contraseña<input id="password" type="password"></label></div><br><button class="btn" onclick="login()">Entrar</button><p id="msg"></p></div></div>`}async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.innerHTML=`<span class="error">${esc(error.message)}</span>`;else load()}async function logout(){await db.auth.signOut();load()}
function groups(active=true){let g={};state.products.filter(p=>!!p.activo===active).sort((a,b)=>entityName(a).localeCompare(entityName(b),"es")||typeName(a).localeCompare(typeName(b),"es")||a.nombre.localeCompare(b.nombre,"es")).forEach(p=>(g[p.entidad_financiera_id]??=[]).push(p));return g}function total(){return state.products.filter(p=>p.activo).reduce((s,p)=>s+value(p),0)}function filtered(ps){let q=state.search.toLowerCase().trim();return q?ps.filter(p=>(p.nombre+" "+(p.isin||"")+" "+(p.ticker||"")).toLowerCase().includes(q)):ps}function empty(){return `<div class="empty">No hay datos para mostrar.</div>`}
function productCard(p){let q=qtyFor(p.id),v=value(p);return `<div class="product" onclick="openProduct('${p.id}')"><div><div class="name">${esc(p.nombre)}</div><span class="badge">${esc(typeName(p))}</span>${p.isin?`<span class="badge">ISIN ${esc(p.isin)}</span>`:""}${p.ticker?`<span class="badge">${esc(p.ticker)}</span>`:""}<div class="meta">${esc(status(p))}</div></div><div class="value">${isAccount(p)||v?money(v):"—"}${badge(p)}<div class="meta">${q?esc(q.toLocaleString("es-ES",{maximumFractionDigits:8}))+" títulos":""}</div></div></div>`}
function entitiesView(){let g=groups(true);return `<div class="card"><div class="toolbar"><h2 style="margin-right:auto">Entidades</h2><button class="btn secondary" onclick="newEntity()">＋ Nueva entidad</button><button class="btn" onclick="manualData()">＋ Introducir datos</button></div><p class="muted">Pulsa el nombre de una entidad para desplegar sus productos.</p>${Object.entries(g).map(([eid,ps])=>{let e=state.entities.find(x=>x.id===eid),open=!!state.expanded[eid],tot=ps.reduce((s,p)=>s+value(p),0);return `<div class="entity-head" onclick="toggleEntity('${eid}')"><div><div><span>${open?"▼":"▶"}</span> <span class="entity-name">${esc(e?.nombre||"Sin entidad")}</span></div><div class="meta">${ps.length} producto${ps.length===1?"":"s"}</div></div><div class="entity-total">${money(tot)}</div></div>${open?`<div class="entity-products">${filtered(ps).map(productCard).join("")||empty()}</div>`:""}`}).join("")||empty()}</div>`}
function inactiveView(){let g=groups(false);return `<div class="card"><div class="toolbar"><h2 style="margin-right:auto">Productos inactivos</h2><span class="badge warn">Se conservan en la base de datos</span></div><p class="muted">Aquí quedan los productos que ya no utilizas. Puedes reactivarlos en cualquier momento.</p>${Object.entries(g).map(([eid,ps])=>`<div class="section"><h3>${esc(state.entities.find(e=>e.id===eid)?.nombre||"Sin entidad")}</h3>${ps.map(p=>`<div class="row inactive"><span><b>${esc(p.nombre)}</b><br><small class="muted">${esc(typeName(p))}${p.isin?" · "+esc(p.isin):""}</small></span><button class="btn secondary" onclick="event.stopPropagation();setActive('${p.id}',true)">Reactivar</button></div>`).join("")}</div>`).join("")||empty()}</div>`}
function summary(){let accounts=state.products.filter(p=>p.activo&&isAccount(p)).reduce((s,p)=>s+value(p),0);return `<div class="hero"><small>Patrimonio total</small><div class="total">${money(total())}</div><div class="stats"><div class="stat">Cuentas<b>${money(accounts)}</b></div><div class="stat">Inversiones<b>${money(total()-accounts)}</b></div><div class="stat">Productos<b>${state.products.filter(p=>p.activo).length}</b></div><div class="stat">Entidades<b>${Object.keys(groups(true)).length}</b></div></div></div><div class="actions"><button class="btn" onclick="load()">🔄 Actualizar</button><button class="btn secondary" onclick="manualData()">＋ Introducir datos</button><button class="btn secondary" onclick="newProduct()">＋ Nuevo producto</button><input class="search" placeholder="🔎 Buscar producto, ISIN o entidad" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div><div class="card"><h2>Control de valoraciones</h2>${conflictsView()}<p class="muted">Las entradas manuales se conservan. Si posteriormente una fuente automática aporta un valor distinto para la misma fecha, Patrimonio te pedirá cuál debe quedar como válida.</p></div>`}
function conflicts(){let m={};for(const v of state.valuations){if(String(v.fecha)>today())continue;let k=v.producto_id+"|"+v.fecha;(m[k]??=[]).push(v)}return Object.values(m).filter(a=>new Set(a.map(x=>String(x.valor_total))).size>1)}function conflictsView(){let c=conflicts();if(!c.length)return `<span class="badge ok">Sin conflictos pendientes</span>`;return c.map(a=>{let p=state.products.find(x=>x.id===a[0].producto_id);return `<div class="conflict"><b>${esc(p?.nombre||"Producto")}</b> · ${dateES(a[0].fecha)}<div>${a.map(v=>`<div class="row"><span>${money(v.valor_total)} · ${esc(v.origen)} · ${esc(v.fuente||"manual")}</span><button class="btn secondary" onclick="chooseVal('${v.id}','${v.producto_id}')">Usar esta</button></div>`).join("")}</div>`}).join("")}
function categoriesView(){let g={};state.products.filter(p=>p.activo).forEach(p=>(g[typeName(p)]??=[]).push(p));return `<div class="card"><h2>Categorías</h2>${Object.entries(g).map(([k,ps])=>`<div class="section"><h3>${esc(k)} <span class="muted">· ${money(ps.reduce((s,p)=>s+value(p),0))}</span></h3>${filtered(ps).map(productCard).join("")}</div>`).join("")||empty()}</div>`}
function libraryView(){return `<div class="grid"><div class="card"><h2>Biblioteca de entidades</h2>${state.masterEntities.map(e=>`<div class="row"><span><b>${esc(e.nombre)}</b><br><small class="muted">${esc(e.tipo||"")}${e.nif?" · "+esc(e.nif):""}</small></span>${e.verificado?'<span class="badge ok">Verificada</span>':''}</div>`).join("")||empty()}</div><div class="card"><h2>Biblioteca de productos</h2>${state.masterProducts.map(p=>`<div class="row"><span><b>${esc(p.nombre)}</b><br><small class="muted">${esc(p.isin||"")}${p.ticker?" · "+esc(p.ticker):""}</small></span><span class="badge">${esc(typeName(p))}</span></div>`).join("")||empty()}</div></div>`}
function sourcesView(){return `<div class="card"><h2>Fuentes de valoración</h2>${state.sources.map(s=>`<div class="row"><span><b>${esc(s.nombre)}</b><br><small class="muted">${esc(s.tipo_fuente||"")} · ${s.tiempo_real?"Tiempo real":"Fin de día"} · ${s.gratuita?"Gratis":"De pago"}</small></span><span class="badge">${s.puntuacion??"—"}</span></div>`).join("")||empty()}</div>`}
function render(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><h1>Patrimonio</h1><p>Tu patrimonio, en un solo lugar</p></div><button class="btn secondary" onclick="logout()">Salir</button></div><div class="tabs"><button class="tab ${state.tab==='resumen'?'active':''}" onclick="state.tab='resumen';render()">🏠 Resumen</button><button class="tab ${state.tab==='entidades'?'active':''}" onclick="state.tab='entidades';render()">🏛️ Entidades</button><button class="tab ${state.tab==='categorias'?'active':''}" onclick="state.tab='categorias';render()">📊 Categorías</button><button class="tab ${state.tab==='inactivos'?'active':''}" onclick="state.tab='inactivos';render()">📁 Inactivos</button><button class="tab ${state.tab==='biblioteca'?'active':''}" onclick="state.tab='biblioteca';render()">📚 Biblioteca</button><button class="tab ${state.tab==='fuentes'?'active':''}" onclick="state.tab='fuentes';render()">🌐 Fuentes</button></div>${state.tab==='resumen'?summary():state.tab==='entidades'?entitiesView():state.tab==='categorias'?categoriesView():state.tab==='inactivos'?inactiveView():state.tab==='biblioteca'?libraryView():sourcesView()}</div>`}
function toggleEntity(id){state.expanded[id]=!state.expanded[id];render()}async function setActive(id,a){let {error}=await db.from("productos").update({activo:a}).eq("id",id).eq("user_id",state.user.id);if(error)alert(error.message);else load()}
function openProduct(id){let p=state.products.find(x=>x.id===id),v=value(p),q=latestQuote(id),lv=latestVal(id),ops=state.ops.filter(o=>o.producto_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));modalContent.innerHTML=`<div class="toolbar"><div style="margin-right:auto"><h2>${esc(p.nombre)}</h2><div class="meta">${esc(entityName(p))} · ${esc(typeName(p))}</div></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="actions"><button class="btn" onclick="manualOperation('${id}')">＋ Operación</button><button class="btn secondary" onclick="manualValuation('${id}')">＋ Valoración / saldo</button><button class="btn secondary" onclick="captureDocument('${id}')">📷 Añadir captura</button>${p.activo?`<button class="btn danger" onclick="setActive('${id}',false);closeModal()">Poner inactivo</button>`:`<button class="btn secondary" onclick="setActive('${id}',true);closeModal()">Reactivar</button>`}</div>${isAccount(p)?accountHistory(id):`<p><span class="badge">Posición ${qtyFor(id).toLocaleString("es-ES",{maximumFractionDigits:8})}</span> <span class="badge">${v?money(v):"Sin valoración actual"}</span></p>`}<h3>Operaciones</h3>${ops.length?`<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Precio</th><th>Neto</th></tr></thead><tbody>${ops.map(o=>`<tr><td>${dateES(o.fecha)}</td><td>${esc(o.tipo_operacion)}</td><td>${Number(o.cantidad||0).toLocaleString("es-ES",{maximumFractionDigits:8})}</td><td>${money(o.precio_unitario)}</td><td>${money(o.importe_neto)}</td></tr>`).join("")}</tbody></table>`:empty()}${q?`<p class="muted">Última cotización: ${dateES(q.fecha)} · ${Number(q.cierre).toLocaleString("es-ES",{maximumFractionDigits:6})}</p>`:""}${lv?`<p class="muted">Valoración válida: ${dateES(lv.fecha)} · ${money(lv.valor_total)} · ${esc(lv.origen)}</p>`:""}${captureList(id)}`;modal.classList.add("open")}
function accountHistory(id){let h=state.valuations.filter(v=>v.producto_id===id&&String(v.fecha)<=today()).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));return `<h3>Histórico de saldo</h3>${h.length?`<table><thead><tr><th>Fecha</th><th>Saldo</th><th>Diferencia</th><th>Origen</th></tr></thead><tbody>${h.map((v,i)=>{let old=h[i+1],d=old?Number(v.valor_total||0)-Number(old.valor_total||0):null;return `<tr><td>${dateES(v.fecha)}</td><td>${money(v.valor_total)}</td><td style="font-weight:800;color:${d>0?'var(--g)':d<0?'var(--r)':'inherit'}">${d==null?'—':(d>=0?'+':'')+money(d)}</td><td>${esc(v.origen)}</td></tr>`}).join("")}</tbody></table>`:empty()}`}
function captureList(id){let c=state.captures.filter(x=>x.producto_id===id);return `<div class="section"><h3>Capturas y documentos</h3>${c.map(x=>`<div class="row"><span>${esc(x.archivo_nombre||"Captura")}<br><small class="muted">${dateES(x.fecha_documento)} · ${esc(x.estado)}</small></span></div>`).join("")||empty()}</div>`}
function manualData(){let p=state.products.find(x=>x.activo)||state.products[0];modalContent.innerHTML=`<h2>Introducir datos manualmente</h2><p class="muted">Selecciona un producto y registra una operación o una valoración. Los datos manuales se conservan aunque después se actualicen las fuentes automáticas.</p><div class="toolbar"><button class="btn" onclick="manualOperation('${p?.id||''}')">＋ Operación</button><button class="btn secondary" onclick="manualValuation('${p?.id||''}')">＋ Valoración / saldo</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>`;modal.classList.add("open")}
function manualOperation(id){let p=state.products.find(x=>x.id===id),opts=['Compra','Venta','Dividendo en efectivo','Dividendo en acciones','Acciones liberadas','Ampliacion de capital','Split','Contrasplit','Traspaso','Aportacion','Retirada','Prima de emisión','Venta de derechos','Ajuste de posición','Otros'];modalContent.innerHTML=`<h2>Registrar operación</h2><div class="form"><label>Producto<select id="op_prod">${state.products.filter(x=>x.activo).map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nombre)}</option>`).join("")}</select></label><label>Fecha<input id="op_fecha" type="date" value="${today()}"></label><label>Tipo<select id="op_tipo">${opts.map(x=>`<option>${x}</option>`).join("")}</select></label><label>Cantidad<input id="op_cantidad" type="number" step="0.00000001" value="0"></label><label>Precio unitario<input id="op_precio" type="number" step="0.00000001" value="0"></label><label>Gastos<input id="op_gastos" type="number" step="0.01" value="0"></label><label>Impuestos<input id="op_imp" type="number" step="0.01" value="0"></label><label>Importe neto<input id="op_neto" type="number" step="0.01" value="0"></label><label class="full">Observaciones<textarea id="op_obs"></textarea></label></div><br><button class="btn" onclick="saveOperation()">Guardar</button> <button class="btn secondary" onclick="closeModal()">Cancelar</button>`;modal.classList.add("open")}
async function saveOperation(){let row={user_id:state.user.id,producto_id:op_prod.value,fecha:op_fecha.value,tipo_operacion:op_tipo.value,cantidad:Number(op_cantidad.value||0),precio_unitario:Number(op_precio.value||0),gastos:Number(op_gastos.value||0),impuestos:Number(op_imp.value||0),importe_neto:Number(op_neto.value||0),importe_bruto:Number(op_cantidad.value||0)*Number(op_precio.value||0),moneda:'EUR',observaciones:op_obs.value};let {error}=await db.from('operaciones').insert(row);if(error)alert(error.message);else{closeModal();load()}}
function manualValuation(id){modalContent.innerHTML=`<h2>Registrar valoración / saldo</h2><div class="form"><label>Producto<select id="va_prod">${state.products.filter(x=>x.activo).map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nombre)}</option>`).join("")}</select></label><label>Fecha<input id="va_fecha" type="date" value="${today()}"></label><label>Cantidad (opcional)<input id="va_cant" type="number" step="0.00000001"></label><label>Precio unitario (opcional)<input id="va_precio" type="number" step="0.00000001"></label><label>Valor total / saldo<input id="va_total" type="number" step="0.01"></label><label>Fuente / documento<input id="va_fuente" value="manual"></label><label class="full">Observaciones<textarea id="va_obs"></textarea></label></div><br><button class="btn" onclick="saveValuation()">Guardar como válida</button> <button class="btn secondary" onclick="closeModal()">Cancelar</button>`;modal.classList.add('open')}
async function saveValuation(){let row={user_id:state.user.id,producto_id:va_prod.value,fecha:va_fecha.value,cantidad:va_cant.value?Number(va_cant.value):null,precio_unitario:va_precio.value?Number(va_precio.value):null,valor_total:Number(va_total.value||0),moneda:'EUR',origen:'manual',fuente:va_fuente.value||'manual',observaciones:va_obs.value,es_valida:true,prioridad_origen:0};await db.from('valoraciones_historicas').update({es_valida:false}).eq('user_id',state.user.id).eq('producto_id',va_prod.value).eq('fecha',va_fecha.value);let {error}=await db.from('valoraciones_historicas').insert(row);if(error)alert(error.message);else{closeModal();load()}}
async function chooseVal(id,pid){await db.from('valoraciones_historicas').update({es_valida:false}).eq('user_id',state.user.id).eq('producto_id',pid);let {error}=await db.from('valoraciones_historicas').update({es_valida:true}).eq('id',id).eq('user_id',state.user.id);if(error)alert(error.message);else load()}
function newEntity(){modalContent.innerHTML=`<h2>Nueva entidad</h2><div class="form"><label>Nombre<input id="enombre"></label><label>Tipo<input id="etipo" placeholder="Banco, broker..."></label></div><br><button class="btn" onclick="saveEntity()">Guardar</button> <button class="btn secondary" onclick="closeModal()">Cancelar</button>`;modal.classList.add('open')}
async function saveEntity(){let nombre=enombre.value.trim(),tipo=etipo.value.trim();if(!nombre)return alert('Indica el nombre.');let {error}=await db.from('entidades_financieras').insert({user_id:state.user.id,nombre,tipo,activo:true});if(error)alert(error.message);else{closeModal();load()}}
function newProduct(){modalContent.innerHTML=`<h2>Nuevo producto</h2><div class="form"><label>Entidad<select id="pr_ent">${state.entities.filter(e=>e.activo).map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></label><label>Categoría<select id="pr_tipo">${state.types.filter(t=>t.activo).map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select></label><label>Nombre<input id="pr_nombre"></label><label>ISIN<input id="pr_isin"></label><label>Ticker<input id="pr_ticker"></label><label>Moneda<input id="pr_moneda" value="EUR"></label></div><br><button class="btn" onclick="saveProduct()">Guardar</button> <button class="btn secondary" onclick="closeModal()">Cancelar</button>`;modal.classList.add('open')}
async function saveProduct(){let row={user_id:state.user.id,entidad_financiera_id:pr_ent.value,tipo_producto_id:pr_tipo.value,nombre:pr_nombre.value.trim(),isin:pr_isin.value.trim()||null,ticker:pr_ticker.value.trim()||null,moneda:pr_moneda.value||'EUR',activo:true};if(!row.nombre)return alert('Indica el nombre.');let {error}=await db.from('productos').insert(row);if(error)alert(error.message);else{closeModal();load()}}
function captureDocument(id){let p=state.products.find(x=>x.id===id);modalContent.innerHTML=`<h2>Captura de ${esc(p.nombre)}</h2><p class="muted">Añade una captura o documento de la entidad. Patrimonio lo guardará, hará una lectura OCR en el navegador y te mostrará los datos detectados para que los confirmes antes de grabarlos.</p><div class="file"><input id="cap_file" type="file" accept="image/*,application/pdf"><div id="cap_status" class="small"></div></div><br><button class="btn" onclick="processCapture('${id}')">Leer captura</button> <button class="btn secondary" onclick="closeModal()">Cancelar</button><div id="cap_result"></div>`;modal.classList.add('open')}
async function processCapture(pid){let f=cap_file.files[0];if(!f)return alert('Selecciona una captura.');cap_status.textContent='Guardando documento y leyendo texto…';let path=state.user.id+'/'+pid+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let up=await db.storage.from('patrimonio-documentos').upload(path,f,{upsert:false});if(up.error){cap_status.textContent='No se pudo guardar: '+up.error.message;return}let {data:doc,error}=await db.from('documentos_capturas').insert({user_id:state.user.id,producto_id:pid,fecha_documento:today(),archivo_nombre:f.name,archivo_tipo:f.type,archivo_path:path,estado:'pendiente'}).select().single();if(error){cap_status.textContent=error.message;return}let text='';if(f.type.startsWith('image/')){try{let r=await Tesseract.recognize(f,'spa+eng',{logger:m=>{if(m.progress)cap_status.textContent='OCR '+Math.round(m.progress*100)+'%'}});text=r.data.text}catch(e){text=''}}let nums=[...text.matchAll(/(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,8})?|\d+(?:,\d{1,8})?)/g)].map(m=>m[1]);let detected={texto:text.slice(0,10000),numeros:nums.slice(0,100),cantidad:guess(text,['participaciones','participaciones adquiridas','acciones','titulos','títulos']),importe:guess(text,['aportacion','aportación','importe','inversion','inversión']),valor:guess(text,['valor liquidativo','valor mercado','valor de mercado','saldo','valor total'])};await db.from('documentos_capturas').update({datos_detectados:detected,estado:'revisado'}).eq('id',doc.id);cap_status.textContent='Lectura terminada. Revisa los datos detectados.';cap_result.innerHTML=`<div class="notice"><b>Datos detectados</b><p class="small">${esc(text.slice(0,2500))}</p><div class="form"><label>Cantidad detectada<input id="det_cant" value="${esc(detected.cantidad||'')}"></label><label>Importe detectado<input id="det_imp" value="${esc(detected.importe||'')}"></label><label>Valor detectado<input id="det_val" value="${esc(detected.valor||'')}"></label></div><br><button class="btn" onclick="confirmCapture('${doc.id}','${pid}')">Confirmar y actualizar</button></div>`}
function guess(text,words){let low=text.toLowerCase();for(const w of words){let i=low.indexOf(w);if(i>=0){let m=text.slice(i+0,i+180).match(/(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,8})?|\d+(?:,\d{1,8})?)/);if(m)return m[1].replace(/\./g,'').replace(',','.')}}return ''}
async function confirmCapture(docid,pid){let c=det_cant.value?Number(String(det_cant.value).replace(',','.')):null,i=det_imp.value?Number(String(det_imp.value).replace(',','.')):null,v=det_val.value?Number(String(det_val.value).replace(',','.')):null;let fecha=today();if(c&&i){let row={user_id:state.user.id,producto_id:pid,fecha,tipo_operacion:'Aportacion',cantidad:c,precio_unitario:i/c,gastos:0,impuestos:0,importe_bruto:i,importe_neto:i,moneda:'EUR',observaciones:'Importado de captura y confirmado por usuario'};let r=await db.from('operaciones').insert(row);if(r.error)return alert(r.error.message)}if(v!=null){await db.from('valoraciones_historicas').update({es_valida:false}).eq('user_id',state.user.id).eq('producto_id',pid).eq('fecha',fecha);let r=await db.from('valoraciones_historicas').insert({user_id:state.user.id,producto_id:pid,fecha,valor_total:v,cantidad:c,origen:'manual',fuente:'Captura confirmada',observaciones:'Valor confirmado por usuario tras OCR',es_valida:true,prioridad_origen:0,moneda:'EUR'});if(r.error)return alert(r.error.message)}await db.from('documentos_capturas').update({datos_confirmados:{cantidad:c,importe:i,valor:v},estado:'confirmado'}).eq('id',docid);closeModal();load()}
function closeModal(){modal.classList.remove('open')}
load().catch(e=>{app.innerHTML=`<div class="wrap"><div class="card error"><h2>Error al cargar Patrimonio</h2><p>${esc(e.message||e)}</p><button class="btn" onclick="load()">Reintentar</button></div></div>`});
</script></body></html>
