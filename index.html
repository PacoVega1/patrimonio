<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrimonio</title>
<style>
:root{--b:#234b86;--bg:#f4f7fb;--c:#fff;--t:#17243d;--m:#71809a;--l:#d9e2ee;--g:#16834b;--r:#c43b32;--w:#8a6919}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t)}
.wrap{max-width:1450px;margin:auto;padding:22px}.top,.toolbar,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:34px}.brand p,.sub{color:var(--m)}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:11px;padding:10px 15px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--b);border:1px solid var(--l)}.btn.red{background:#fff0ef;color:var(--r)}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.tab{padding:11px 16px;border:1px solid var(--l);border-radius:12px;background:#fff;font-weight:800;cursor:pointer}.tab.active{background:var(--b);color:#fff}
.hero{background:linear-gradient(135deg,#204784,#3269c9);color:#fff;border-radius:22px;padding:27px;margin-bottom:18px}.total{font-size:46px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:#ffffff20;padding:14px;border-radius:13px}.stat b{display:block;font-size:20px;margin-top:5px}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 6px 20px #17243d0a}.section{border:2px solid #c8d8eb;border-radius:20px;padding:16px;margin:18px 0;background:#fff}.section-title{font-size:25px;font-weight:900;margin:0 0 6px}.entity,.category{border:2px solid #b9cde4;border-radius:20px;margin:18px 0;overflow:hidden;box-shadow:0 7px 18px #17243d12}.entity-head{padding:20px;background:linear-gradient(90deg,#dceafa,#f7fbff);display:grid;grid-template-columns:1fr auto;cursor:pointer}.entity-name{font-size:24px;font-weight:900}.entity-total{font-size:24px;font-weight:900}.entity-body{background:#fff;border-top:4px solid #c6d9ef;padding:12px 18px}.category-head{padding:19px 20px;background:linear-gradient(90deg,#e4f1e8,#fbfdfb);border-bottom:4px solid #cfe5d5}.category-head h3{margin:0;color:#176b42;font-size:23px}.tablewrap{overflow:auto}.ptable,.history{width:100%;border-collapse:collapse;min-width:900px}.ptable th,.history th{font-size:12px;text-transform:uppercase;color:var(--m);padding:12px 8px;border-bottom:2px solid var(--l);text-align:right}.ptable th:first-child,.ptable td:first-child,.history th:first-child,.history td:first-child{text-align:left}.ptable td,.history td{padding:13px 8px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}.ptable tbody tr:hover{background:#f7faff;cursor:pointer}.pname{font-weight:850}.gain{color:var(--g);font-weight:850}.loss{color:var(--r);font-weight:850}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf3ff;color:#2459b0;font-size:11px;font-weight:800}.pill.ok{background:#eaf7ef;color:#176b42}.pill.warn{background:#fff7df;color:var(--w)}
.inactive{background:#fffdf5;border:1px solid #eadfbd;border-radius:15px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{padding:12px 0;border-bottom:1px solid var(--l)}.row:last-child{border-bottom:0}.modal{position:fixed;inset:0;background:#09152a99;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalbox{background:#fff;width:min(1100px,100%);max-height:94vh;overflow:auto;border-radius:20px;padding:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;font-weight:800}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid var(--l);border-radius:10px;padding:10px}.full{grid-column:1/-1}.notice{padding:13px;border-radius:11px;background:#fff7df;color:var(--w);margin:10px 0}.error{padding:13px;border-radius:11px;background:#fff0ef;color:var(--r)}.library-item{padding:14px;border:1px solid var(--l);border-radius:13px;background:#fbfdff;margin:9px 0}.empty{padding:18px;text-align:center;color:var(--m)}
@media(max-width:800px){.stats,.grid,.form{grid-template-columns:1fr 1fr}.entity-head{grid-template-columns:1fr}.entity-total{margin-top:8px}}@media(max-width:550px){.wrap{padding:13px}.stats,.grid,.form{grid-template-columns:1fr}.total{font-size:38px}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card"><h1>Patrimonio</h1><p>Cargando...</p></div></div></div>
<div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div>
<script>
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a){a.innerHTML='<div class="wrap"><div class="card error"><h2>No se ha podido cargar Patrimonio</h2><p>'+String(e.message||'Error desconocido')+'</p></div></div>';}});
function cargarPatrimonio(){var s=document.createElement('script');s.src='./app.js?v=20260829-1900';s.onload=function(){var f=document.createElement('script');f.src='./ui-fixes.js?v=20260829-1900';f.onload=function(){var y=document.createElement('script');y.src='./yahoo-sync.js?v=20260829-1900';y.onload=function(){var z=document.createElement('script');z.src='./pension-ops-fix.js?v=20260829-1900';document.body.appendChild(z);};document.body.appendChild(y);};document.body.appendChild(f);};s.onerror=function(){document.getElementById('app').innerHTML='<div class="wrap"><div class="card error"><h2>No se ha podido cargar Patrimonio</h2><p>No se pudo cargar app.js.</p></div></div>';};document.body.appendChild(s);}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="cargarPatrimonio()" onerror="document.getElementById('app').innerHTML='<div class=&quot;wrap&quot;><div class=&quot;card error&quot;><h2>No se ha podido cargar Patrimonio</h2><p>No se ha podido cargar la biblioteca de Supabase.</p></div></div>'"></script>
</body>
</html>
