  function euro(value) {

    const number = Number(value || 0);

    return new Intl.NumberFormat("es-ES", {
      style: "currency",
      currency: "EUR",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(number);

  }


  function number(value, decimals = 6) {

    return Number(value || 0).toLocaleString(
      "es-ES",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: decimals
      }
    );

  }


  function dateES(value) {

    if (!value) return "";

    const date =
      new Date(value + "T00:00:00");

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleDateString("es-ES");

  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  async function actualizarTodo() {

    const button = $("updateButton");
    const status = $("updateStatus");
    const report = $("updateReport");

    button.disabled = true;
    button.classList.add("loading");
    button.textContent = "⏳ Actualizando...";

    status.textContent = "Consultando las fuentes configuradas...";
    report.classList.add("hidden");

    try {
      const { data, error } = await supabase.functions.invoke("actualizar-cotizaciones", {
        body: {}
      });

      if (error) throw error;

      const result = data || {};
      const resumen = result.resumen || {};
      const detalles = result.detalles || [];

      const actualizados = Number(resumen.actualizados || 0);
      const discrepancias = Number(resumen.discrepancias || 0);
      const sinFuente = Number(resumen.sin_fuente || 0);
      const errores = Number(resumen.errores || 0);

      status.className = "update-status " + (errores || sinFuente ? "warning" : discrepancias ? "warning" : "success");
      status.textContent = `Actualización terminada · ${actualizados} valores nuevos · ${discrepancias} discrepancias`;

      const lines = detalles.map(d => {
        const name = escapeHTML(d.producto || "Producto");
        if (d.estado === "actualizado") return `<li>✅ <strong>${name}</strong>: ${escapeHTML(d.fecha || "")}</li>`;
        if (d.estado === "discrepancia") return `<li>⚠️ <strong>${name}</strong>: manual ${escapeHTML(String(d.manual ?? ""))} · automático ${escapeHTML(String(d.automatico ?? ""))}</li>`;
        if (d.estado === "sin_fuente") return `<li>🟠 <strong>${name}</strong>: fuente configurada pero no disponible para actualización automática.</li>`;
        if (d.estado === "error") return `<li>❌ <strong>${name}</strong>: ${escapeHTML(d.error || "Error")}</li>`;
        return `<li>ℹ️ <strong>${name}</strong>: ${escapeHTML(d.mensaje || "Sin cambios")}</li>`;
      }).join("");

      report.innerHTML = `<strong>Resultado de la actualización</strong><ul>${lines}</ul>`;
      report.classList.remove("hidden");

      await loadApp();

      button.textContent = "🔄 Actualizar todo";

  async function getLatestValue(productId) {

    const [quotesResult, valuationsResult] = await Promise.all([
      supabase.from("cotizaciones_historicas")
        .select("fecha,cierre,moneda,fuente_id,observaciones")
        .eq("producto_id", productId)
        .order("fecha", { ascending:false })
        .limit(1)
        .maybeSingle(),
      supabase.from("valoraciones_historicas")
        .select("fecha,precio_unitario,valor_total,origen,fuente,observaciones")
        .eq("producto_id", productId)
        .order("fecha", { ascending:false })
        .limit(1)
        .maybeSingle()
    ]);

    if (quotesResult.error) throw quotesResult.error;
    if (valuationsResult.error) throw valuationsResult.error;

    const q = quotesResult.data;
    const v = valuationsResult.data;

    if (!q && !v) return null;
    if (!q) return { kind:"valuation", ...v, price:Number(v.precio_unitario || 0) };
    if (!v) return { kind:"quote", fecha:q.fecha, price:Number(q.cierre || 0), moneda:q.moneda, fuente:q.fuente_id };

    return q.fecha >= v.fecha
      ? { kind:"quote", fecha:q.fecha, price:Number(q.cierre || 0), moneda:q.moneda, fuente:q.fuente_id }
      : { kind:"valuation", ...v, price:Number(v.precio_unitario || 0) };
  }

  async function loadApp() {

    try {

      const sessionResult = await supabase.auth.getSession();

      showApp();

        .from("carteras")
        .select("id,nombre,descripcion,fecha_inicio,moneda")
        .eq("activa", true)
        .order("nombre");

      if (portfoliosResult.error) throw portfoliosResult.error;

      const portfolios = portfoliosResult.data || [];

      /* ------------------------------------------------------
         2. TODOS LOS PRODUCTOS DEL USUARIO
         La aplicación no debe limitarse a las carteras.
         ------------------------------------------------------ */
      const [productsResult, typesResult, entitiesResult] = await Promise.all([
        supabase
          .from("productos")
          .select("id,nombre,isin,ticker,moneda,tipo_producto_id,entidad_financiera_id,activo")
          .eq("activo", true)
          .order("nombre"),
        supabase
          .from("tipos_productos")
          .select("id,nombre"),
        supabase
          .from("entidades_financieras")
          .select("id,nombre")
      ]);

      if (productsResult.error) throw productsResult.error;
      if (typesResult.error) throw typesResult.error;
      if (entitiesResult.error) throw entitiesResult.error;

      const products = productsResult.data || [];
      const typeMap = new Map((typesResult.data || []).map(x => [x.id, x.nombre]));
      const entityMap = new Map((entitiesResult.data || []).map(x => [x.id, x.nombre]));

      /* ------------------------------------------------------
         3. COMPONENTES DE LAS CARTERAS
         Se excluyen después de aquí para no duplicarlos.
         ------------------------------------------------------ */
      const componentRows = [];
      for (const portfolio of portfolios) {
        const r = await supabase
          .from("cartera_componentes")
          .select("id,producto_id,cantidad,activo")
          .eq("cartera_id", portfolio.id)
          .eq("activo", true);

        if (r.error) throw r.error;

        for (const component of (r.data || [])) {
          componentRows.push({
            ...component,
            cartera_id: portfolio.id
          });

      }

      const componentProductIds = new Set(componentRows.map(x => x.producto_id));

      /* ------------------------------------------------------

      const operationsResult = await supabase
        .from("operaciones")

        .order("fecha", { ascending: true })

      /* ------------------------------------------------------
         5. ÚLTIMA VALORACIÓN / COTIZACIÓN DE CADA PRODUCTO
         ------------------------------------------------------ */
      async function getLatestValueCached(productId) {
        return await getLatestValue(productId);
      }

      function currentQuantity(product, latestValue) {
        const ops = operationsByProduct.get(product.id) || [];

        if (latestValue?.kind === "valuation" && latestValue.cantidad !== null && latestValue.cantidad !== undefined) {
          const q = Number(latestValue.cantidad);
          if (Number.isFinite(q)) return q;
        }

        if (!ops.length) return 1;

        const type = typeMap.get(product.tipo_producto_id) || "";

        /* Fondos de Bankinter y otros fondos independientes:
           compras - ventas. */
        if (type === "Fondos de inversión") {
          let q = 0;
          for (const op of ops) {
            const qty = Math.abs(Number(op.cantidad || 0));
            const t = String(op.tipo_operacion || "").toLowerCase();
            if (t === "compra" || t === "aportacion" || t === "entrada") q += qty;
            else if (t === "venta" || t === "retiro" || t === "salida") q -= qty;
            else if (t.includes("traspaso") && Number(op.cantidad || 0) < 0) q -= qty;
            else if (t.includes("traspaso") && Number(op.cantidad || 0) > 0) q += qty;
          }
          return Math.max(0, q);
        }

        /* Acciones: muchas operaciones de dividendos contienen la
           cantidad de acciones que había en ese momento. Las usamos
           como fotografía de posición. Los splits/traspasos pueden
           modificarla explícitamente. */
        if (type === "Acciones") {
          let q = 0;
          for (const op of ops) {
            const t = String(op.tipo_operacion || "").toLowerCase();
            const qty = Number(op.cantidad || 0);

            if (t === "compra") q += Math.abs(qty);
            else if (t === "venta") q -= Math.abs(qty);
            else if (t.includes("dividendo") || t.includes("acciones liberadas")) {
              if (qty > 0 && (t.includes("efectivo") || t.includes("acciones") || t.includes("liberadas"))) q = qty;
            } else if (t === "split") {
              const m = String(op.observaciones || "").match(/pasan?\s+a\s+([0-9.,]+)/i);
              if (m) q = Number(m[1].replace(/\./g, "").replace(",", "."));
            } else if (t.includes("traspaso")) {
              if (qty < 0) q = Math.max(0, q - Math.abs(qty));
              else if (qty > 0) q += qty;
            }
          }
          return Math.max(0, q);
        }

        /* Otros productos con operaciones. */
        let q = 0;

          const t = String(op.tipo_operacion || "").toLowerCase();
          if (t === "compra" || t === "aportacion" || t === "entrada") q += qty;
          else if (t === "venta" || t === "retiro" || t === "salida") q -= qty;
          else if (t.includes("traspaso")) q += Number(op.cantidad || 0);
        }
        return Math.max(0, q);
      }

      let totalPatrimonio = 0;

          if (latestValue?.kind === "valuation" && latestValue.valor_total !== null && latestValue.valor_total !== undefined) {
            positionValue = Number(latestValue.valor_total || 0);

                ${portfolio.descripcion ? `<div class="muted small" style="margin-top:5px">${escapeHTML(portfolio.descripcion)}</div>` : ""}
              </div>

      const independentProducts = products.filter(p => !componentProductIds.has(p.id));
      const groups = new Map();

      for (const product of independentProducts) {

      const typeOrder = [
        "Cuentas corrientes",

        "Cuenta de ahorro",

      ];

            positionValue = price * quantity;
          }

          /* Para cuentas, el valor total de la última valoración es
             el saldo, aunque no exista una cantidad. */
          if ((type.includes("Cuenta")) && latestValue?.valor_total !== null && latestValue?.valor_total !== undefined) {
            positionValue = Number(latestValue.valor_total || 0);
          }

          const hasData = latestValue || ops.length > 0 || quantity > 0;
          if (!hasData) continue;

          groupTotal += positionValue;
          totalPatrimonio += positionValue;
          totalPosiciones++;
          visibleCount++;

          const entity = entityMap.get(product.entidad_financiera_id) || "";
          groupHTML += renderPosition(product, quantity, price, positionValue, latestValue, entity, type);
        }

        if (!visibleCount) continue;

        html += `
          <section class="card">
            <div class="row mobile-column">
              <div class="column">
                <span class="pill">${escapeHTML(type)}</span>
                <h2>${escapeHTML(type)}</h2>
              </div>
              <div class="hero-value" style="color:#172033">${euro(groupTotal)}</div>
            </div>
            <div class="section-title">Productos</div>
            ${groupHTML}
          </section>
        `;
      }

      /* ------------------------------------------------------
         RESUMEN PRINCIPAL
         ------------------------------------------------------ */
      const summary = `
        <section class="card hero">
          <div class="muted">Patrimonio total</div>
          <div class="hero-value">${euro(totalPatrimonio)}</div>
          <div class="summary-grid">
            <div class="summary-box">
              <div class="summary-label">Carteras</div>
              <div class="summary-number">${portfolios.length}</div>
            </div>
            <div class="summary-box">
              <div class="summary-label">Posiciones</div>
              <div class="summary-number">${totalPosiciones}</div>
            </div>
            <div class="summary-box">
              <div class="summary-label">Productos</div>
              <div class="summary-number">${independentProducts.length + componentProductIds.size}</div>
            </div>
          </div>
        </section>
      `;

      $("content").innerHTML = summary + html;

    } catch (error) {
      console.error("Error cargando Patrimonio:", error);
      $("content").innerHTML = `
        <section class="card">
          <div class="section-title">No se ha podido cargar Patrimonio</div>
          <div class="error">${escapeHTML(error?.message || "Error desconocido")}</div>
          <button class="button" onclick="location.reload()">Reintentar</button>
        </section>
      `;
    }

  }


  function renderPosition(product, quantity, price, positionValue, latestValue, entity = "", type = "") {
    const valuationDate = latestValue?.fecha ? dateES(latestValue.fecha) : "";
    const source = latestValue?.fuente || latestValue?.fuente_id || "";

    return `
      <div class="position">
        <div class="row mobile-column">
          <div class="column">
            <div class="name">${escapeHTML(product.nombre)}</div>
            ${entity ? `<div class="muted small">Entidad: ${escapeHTML(entity)}</div>` : ""}
            ${product.isin ? `<div class="muted small">ISIN: ${escapeHTML(product.isin)}</div>` : ""}
            ${product.ticker ? `<div class="muted small">Ticker: ${escapeHTML(product.ticker)}</div>` : ""}
          </div>
          <div class="column">
            <div class="amount">${euro(positionValue)}</div>
            ${price ? `<div class="muted small">Precio: ${euro(price)}</div>` : ""}
          </div>
        </div>
        <div class="muted small" style="margin-top:6px">
          ${quantity > 0 ? `${number(quantity)} ${type.includes("Cuenta") ? "unidad" : "participaciones"}` : "Sin posición cuantificada"}
          ${valuationDate ? ` · Valoración ${valuationDate}` : ""}
          ${source ? ` · Fuente: ${escapeHTML(source)}` : ""}
        </div>
      </div>
    `;
  }

  /* ==========================================================
     LOGIN
     ========================================================== */

  $("loginButton").addEventListener(
    "click",
    async () => {

      const email =
        $("email").value.trim();

      const password =
        $("password").value;


      if (!email || !password) {

        $("loginMessage").className =
          "message error";

        $("loginMessage").textContent =
          "Introduce el correo electrónico y la contraseña.";

        return;

      }


      const button =
        $("loginButton");

      button.disabled = true;

      button.textContent =
        "Entrando...";

      $("loginMessage").textContent =
        "";


      try {

        const result =
          await supabase.auth.signInWithPassword({
            email,
            password
          });


        if (result.error) {

          $("loginMessage").className =
            "message error";

          $("loginMessage").textContent =
            result.error.message;

          return;

        }


        $("loginMessage").className =
          "message success";

        $("loginMessage").textContent =
          "";


        await loadApp();


      } catch (error) {

        $("loginMessage").className =
          "message error";

        $("loginMessage").textContent =
          error.message ||
          "No se ha podido iniciar sesión.";

      } finally {

        button.disabled = false;

        button.textContent =
          "Entrar";

      }

    }
  );


  /* ==========================================================
     ENTER PARA INICIAR SESIÓN
     ========================================================== */

  $("password").addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        $("loginButton").click();

      }

    }
  );


  /* ==========================================================
     ACTUALIZAR TODO
     ========================================================== */

  $("updateButton").addEventListener("click", actualizarTodo);


  /* ==========================================================
     CERRAR SESIÓN
     ========================================================== */

  $("logoutButton").addEventListener(
    "click",
    async () => {

      await supabase.auth.signOut();

      showLogin();

      $("email").value = "";
      $("password").value = "";

    }
  );


  /* ==========================================================
     INICIO
     ========================================================== */

  loadApp();

</script>

</body>
</html>
