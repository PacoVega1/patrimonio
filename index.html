const SUPABASE_URL='https://rnwtvkhnhybdgxhmgebw.supabase.co',SUPABASE_KEY='sb_publishable_r00Qvz_GBmRi4fVj6O7scA_jIj9wuyN',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={user:null,products:[],entities:[],types:[],ops:[],vals:[],quotes:[],sources:[],interests:[],tab:'resumen',expanded:{},search:''};
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0),num=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:8}).format(Number(n)||0),dateES=d=>d?new Intl.DateTimeFormat('es-ES').format(new Date(d+'T00:00:00')):'—',today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const typeName=p=>S.types.find(t=>t.id===p.tipo_producto_id)?.nombre||'Sin categoría',entityName=p=>S.entities.find(e=>e.id===p.entidad_financiera_id)?.nombre||'Sin entidad',isAccount=p=>['Cuenta corriente','Cuenta de ahorro','Cuenta de inversión'].includes(typeName(p));
const POSITION_TYPES=new Set(['Compra','Aportacion','Aportación','Acciones liberadas','Dividendo en acciones','Split']);function qtyDelta(o){let t=o.tipo_operacion||'',n=Number(o.cantidad||0);if(POSITION_TYPES.has(t))return Math.abs(n);if(t==='Venta')return -Math.abs(n);if(t==='Ajuste de posición'||t==='Traspaso')return n;return 0}function qtyFor(id){return S.ops.filter(o=>o.producto_id===id).reduce((s,o)=>s+qtyDelta(o),0)}
function validRows(id){return S.vals.filter(v=>v.producto_id===id&&String(v.fecha)<=today())}function latestVal(id){let a=validRows(id),v=a.filter(x=>x.es_valida).sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)))[0];return v||a.sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)))[0]}function latestQuote(id){return S.quotes.filter(q=>q.producto_id===id&&String(q.fecha)<=today()).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0]}function quoteFresh(q){if(!q)return false;return (new Date()-new Date(q.fecha+'T00:00:00'))/86400000<=10}function valFresh(v){if(!v)return false;return (new Date()-new Date(v.fecha+'T00:00:00'))/86400000<=45}
function currentQuote(p){let q=latestQuote(p.id),v=latestVal(p.id);return q&&quoteFresh(q)?q:v&&valFresh(v)?{fecha:v.fecha,cierre:Number(v.precio_unitario||0),valor_total:Number(v.valor_total||0),manual:true}:null}function value(p){let v=latestVal(p.id),q=latestQuote(p.id);if(isAccount(p))return Number(v?.valor_total||0);if(v&&valFresh(v))return Number(v.valor_total||0);if(q&&quoteFresh(q)&&qtyFor(p.id))return Number(q.cierre||0)*qtyFor(p.id)*Number(q.factor_conversion||1);return 0}
function prevValue(p){let v=validRows(p.id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));return v[1]?Number(v[1].valor_total||0):0}function diff(p){return value(p)-prevValue(p)}function pct(p){let old=prevValue(p);return old?diff(p)/old*100:0}function activeProducts(){return S.products.filter(p=>p.activo!==false)}
async function pagedQuotes(){let all=[],from=0;while(true){let {data,error}=await db.from('cotizaciones_historicas').select('*').order('fecha',{ascending:false}).range(from,from+999);if(error)throw error;all.push(...(data||[]));if(!data||data.length<1000)break;from+=1000}return all}
async function load(){let {data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user){loginView();return}S.user=user;let r=await Promise.all([db.from('productos').select('*').eq('user_id',user.id),db.from('entidades_financieras').select('*').eq('user_id',user.id),db.from('tipos_productos').select('*').eq('activo',true).order('orden_presentacion'),db.from('operaciones').select('*').eq('user_id',user.id).order('fecha'),db.from('valoraciones_historicas').select('*').eq('user_id',user.id).order('fecha'),pagedQuotes(),db.from('fuentes_valoracion').select('*').order('puntuacion',{ascending:false}),db.from('intereses_cuentas').select('*').eq('user_id',user.id).order('fecha',{ascending:false})]);let n=['products','entities','types','ops','vals','quotes','sources','interests'];for(let i=0;i<r.length;i++){if(r[i].error)throw r[i].error;S[n[i]]=r[i].data||r[i]||[]}render()}
function loginView(){app.innerHTML=`<div class="wrap"><div class="card" style="max-width:430px;margin:100px auto"><h1>Patrimonio</h1><div class="form"><label class="full">Email<input id="email" type="email"></label><label class="full">Contraseña<input id="password" type="password"></label></div><br><button class="btn" onclick="login()">Entrar</button><p id="msg"></p></div></div>`}async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.innerHTML='<div class="error">'+esc(error.message)+'</div>';else load()}async function logout(){await db.auth.signOut();load()}
function entityGroups(active=true){let g={};activeProducts().filter(p=>!!p.activo===active).forEach(p=>(g[p.entidad_financiera_id]??=[]).push(p));return g}function total(){return activeProducts().reduce((s,p)=>s+value(p),0)}function accountsTotal(){return activeProducts().filter(isAccount).reduce((s,p)=>s+value(p),0)}function search(ps){let q=S.search.trim().toLowerCase();return q?ps.filter(p=>(p.nombre+' '+(p.isin||'')+' '+(p.ticker||'')).toLowerCase().includes(q)):ps}
function productRows(ps){return `<table class="product-table"><thead><tr><th>Producto</th><th>Fecha</th><th>Nº títulos</th><th>Última cotización</th><th>Total</th><th>Diferencia</th><th>%</th></tr></thead><tbody>${search(ps).map(p=>{let q=latestQuote(p.id),v=value(p),d=diff(p),pc=pct(p),date=q?.fecha||latestVal(p.id)?.fecha;return `<tr onclick="openProduct('${p.id}')"><td><div class="product-name">${esc(p.nombre)}</div><span class="pill">${esc(typeName(p))}</span>${p.isin?` <span class="pill">${esc(p.isin)}</span>`:''}</td><td>${dateES(date)}</td><td>${isAccount(p)?'—':num(qtyFor(p.id))}</td><td>${isAccount(p)?'—':q?num(q.cierre)+' €':'—'}</td><td><b>${v?money(v):'—'}</b></td><td class="${d>0?'gain':d<0?'loss':''}">${d?((d>0?'+':'')+money(d)):'—'}</td><td class="${pc>0?'gain':pc<0?'loss':''}">${pc?((pc>0?'+':'')+pc.toFixed(2)+' %'):'—'}</td></tr>`}).join('')}</tbody></table>`}
function entitiesView(){let g=entityGroups(true);return `<div class="card"><div class="toolbar"><h2>Entidades</h2><button class="btn" onclick="manualData()">＋ Introducir datos</button><button class="btn secondary" onclick="newEntity()">＋ Nueva entidad</button></div><input class="search" style="margin:15px 0" placeholder="Buscar producto, ISIN o ticker" value="${esc(S.search)}" oninput="S.search=this.value;render()">${Object.entries(g).map(([id,ps])=>{let e=S.entities.find(x=>x.id===id),open=!!S.expanded[id],tot=ps.reduce((s,p)=>s+value(p),0);return `<div class="entity"><div class="entity-head" onclick="toggle('${id}')"><div><div class="entity-name">${open?'▾':'▸'} ${esc(e?.nombre||'Sin entidad')}</div><div class="entity-sub">${ps.length} producto${ps.length===1?'':'s'} ${e?.entidad_maestra_id?' · ✓ Verificada':' · Pendiente de verificar'}</div></div><div class="entity-total">${money(tot)}</div></div>${open?`<div class="entity-body">${productRows(ps)}</div>`:''}</div>`}).join('')||'<div class="muted">No hay entidades activas.</div>'}</div>`}
function categoriesView(){let g={};activeProducts().forEach(p=>(g[typeName(p)]??=[]).push(p));return `<div class="card"><div class="section-title">Categorías</div><p class="muted">Productos agrupados por tipo, con el mismo formato de valoración.</p>${Object.entries(g).map(([k,ps])=>`<div class="category"><h3>${esc(k)} · ${money(ps.reduce((s,p)=>s+value(p),0))}</h3>${productRows(ps)}</div>`).join('')||'<div class="muted">No hay productos.</div>'}</div>`}
function inactiveView(){let g=entityGroups(false);let groups=Object.entries(g).filter(([,ps])=>ps.length);return `<div class="card"><div class="toolbar"><div class="section-title">📁 Inactivos</div><span class="pill warn">No se borran los históricos</span></div>${groups.map(([id,ps])=>`<div class="inactive-card"><h3>${esc(S.entities.find(e=>e.id===id)?.nombre||'Sin entidad')}</h3>${ps.map(p=>`<div class="row"><div><b>${esc(p.nombre)}</b><div class="muted">${esc(typeName(p))}${p.isin?' · '+esc(p.isin):''}</div></div><button class="btn secondary" onclick="setActive('${p.id}',true)">Reactivar</button></div>`).join('')}</div>`).join('')||'<div class="muted">No hay productos inactivos.</div>'}</div>`}
function summary(){let ps=activeProducts(),up=ps.filter(p=>diff(p)>0).length,down=ps.filter(p=>diff(p)<0).length;return `<div class="hero"><div>Patrimonio total</div><div class="total">${money(total())}</div><div class="stats"><div class="stat"><span>Cuentas</span><b>${money(accountsTotal())}</b></div><div class="stat"><span>Inversiones</span><b>${money(total()-accountsTotal())}</b></div><div class="stat"><span>Productos</span><b>${ps.length}</b></div><div class="stat"><span>Suben / bajan</span><b>${up} / ${down}</b></div></div></div><div class="grid"><div class="card"><div class="section-title">Evolución por productos</div><div class="chart">${ps.slice(0,40).map(p=>{let h=Math.min(100,Math.max(4,value(p)/Math.max(1,total())*100*4));return `<div class="bar ${diff(p)>=0?'up':'down'}" style="height:${h}%" title="${esc(p.nombre)} · ${money(value(p))}"></div>`}).join('')}</div><div class="chart-label">Verde: subida · Rojo: bajada</div></div><div class="card"><div class="section-title">Últimos movimientos de valor</div>${ps.slice().sort((a,b)=>Math.abs(diff(b))-Math.abs(diff(a))).slice(0,8).map(p=>`<div class="row"><span><b>${esc(p.nombre)}</b><br><small class="muted">${dateES(latestVal(p.id)?.fecha||latestQuote(p.id)?.fecha)}</small></span><span class="${diff(p)>=0?'gain':'loss'}">${diff(p)>=0?'+':''}${money(diff(p))} · ${pct(p).toFixed(2)}%</span></div>`).join('')||'<div class="muted">Sin histórico suficiente.</div>'}</div></div>`}
function interestsView(){let rows=S.interests;return `<div class="card"><div class="toolbar"><div class="section-title">Intereses</div><button class="btn" onclick="newInterest()">＋ Añadir interés</button></div><p class="muted">Intereses de cuentas corrientes, ahorro e inversión: bruto, retención y neto.</p><table class="history"><thead><tr><th style="text-align:left">Fecha</th><th>Producto</th><th>Bruto</th><th>Retención</th><th>Neto</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="text-align:left">${dateES(r.fecha)}</td><td>${esc(S.products.find(p=>p.id===r.producto_id)?.nombre||'—')}</td><td>${money(r.importe_bruto)}</td><td>${money(r.retencion)}</td><td><b>${money(r.importe_neto)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No hay intereses registrados.</td></tr>'}</tbody></table></div>`}
function sourcesView(){return `<div class="card"><div class="section-title">Fuentes de valoración</div>${S.sources.map(s=>`<div class="row"><span><b>${esc(s.nombre)}</b><br><small class="muted">${esc(s.tipo_fuente||'')} · ${s.tiempo_real?'Tiempo real':'Fin de día'} · ${s.gratuita?'Gratis':'De pago'}</small></span><b>${s.puntuacion??'—'}</b></div>`).join('')||'<div class="muted">No hay fuentes.</div>'}</div>`}
function toggle(id){S.expanded[id]=!S.expanded[id];render()}function nav(t){S.tab=t;render()}function render(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><h1>Patrimonio</h1><p>Tu patrimonio, en un solo lugar</p></div><button class="btn secondary" onclick="logout()">Salir</button></div><div class="tabs"><button class="tab ${S.tab==='resumen'?'active':''}" onclick="nav('resumen')">Resumen general</button><button class="tab ${S.tab==='entidades'?'active':''}" onclick="nav('entidades')">Entidades</button><button class="tab ${S.tab==='categorias'?'active':''}" onclick="nav('categorias')">Categorías</button><button class="tab ${S.tab==='intereses'?'active':''}" onclick="nav('intereses')">Intereses</button><button class="tab ${S.tab==='fuentes'?'active':''}" onclick="nav('fuentes')">Fuentes</button><button class="tab ${S.tab==='inactivos'?'active':''}" onclick="nav('inactivos')">📁 Inactivos</button></div>${S.tab==='resumen'?summary():S.tab==='entidades'?entitiesView():S.tab==='categorias'?categoriesView():S.tab==='intereses'?interestsView():S.tab==='fuentes'?sourcesView():inactiveView()}</div>`}
function modal(html){modalContent.innerHTML=html;modalEl.classList.add('open')}function closeModal(){modalEl.classList.remove('open')}const modalEl=document.getElementById('modal');
function manualData(){let accounts=activeProducts().filter(isAccount);modal(`<div class="toolbar"><h2>Introducir datos</h2><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="card"><h3>Saldo de cuenta</h3><p class="muted">Para cuentas bancarias solo necesitas indicar fecha y saldo.</p><div class="form"><label class="full">Cuenta<select id="mprod">${accounts.map(p=>`<option value="${p.id}">${esc(entityName(p))} · ${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="mdate" type="date" value="${today()}"></label><label>Saldo<input id="msaldo" type="number" step="0.01"></label><label class="full">Observaciones<textarea id="mobs"></textarea></label></div><br><button class="btn" onclick="saveBalance()">Guardar saldo</button></div><div class="card"><h3>Valoración manual de inversión</h3><div class="form"><label class="full">Producto<select id="vprod">${activeProducts().filter(p=>!isAccount(p)).map(p=>`<option value="${p.id}">${esc(entityName(p))} · ${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="vdate" type="date" value="${today()}"></label><label>Cantidad / títulos<input id="vqty" type="number" step="0.00000001"></label><label>Precio / participación<input id="vprice" type="number" step="0.00000001"></label><label>Valor total<input id="vtotal" type="number" step="0.01"></label></div><br><button class="btn" onclick="saveValuation()">Guardar valoración</button></div>`)}
async function saveBalance(){let p=document.getElementById('mprod').value,d=document.getElementById('mdate').value,s=Number(document.getElementById('msaldo').value);if(!d||!Number.isFinite(s))return alert('Indica fecha y saldo.');let {error}=await db.from('valoraciones_historicas').insert({user_id:S.user.id,producto_id:p,fecha:d,cantidad:null,precio_unitario:null,valor_total:s,moneda:'EUR',origen:'manual',fuente:'usuario',observaciones:document.getElementById('mobs').value,es_valida:true,prioridad_origen:100});if(error)alert(error.message);else{closeModal();load()}}
async function saveValuation(){let p=document.getElementById('vprod').value,d=document.getElementById('vdate').value,q=Number(document.getElementById('vqty').value),pr=Number(document.getElementById('vprice').value),tot=Number(document.getElementById('vtotal').value);if(!d||!Number.isFinite(tot))return alert('Indica fecha y valor total.');let {error}=await db.from('valoraciones_historicas').insert({user_id:S.user.id,producto_id:p,fecha:d,cantidad:Number.isFinite(q)?q:null,precio_unitario:Number.isFinite(pr)?pr:null,valor_total:tot,moneda:'EUR',origen:'manual',fuente:'usuario',es_valida:true,prioridad_origen:100});if(error)alert(error.message);else{closeModal();load()}}
function newInterest(){let accounts=activeProducts().filter(isAccount);modal(`<div class="toolbar"><h2>Añadir interés</h2><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="form"><label class="full">Cuenta<select id="iprod">${accounts.map(p=>`<option value="${p.id}">${esc(entityName(p))} · ${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="idate" type="date" value="${today()}"></label><label>Bruto<input id="ibruto" type="number" step="0.01" oninput="calcInterest()"></label><label>Retención<input id="iret" type="number" step="0.01" oninput="calcInterest()"></label><label>Neto<input id="ineto" type="number" step="0.01"></label><label class="full">Observaciones<textarea id="iobs"></textarea></label></div><br><button class="btn" onclick="saveInterest()">Guardar interés</button>`)}function calcInterest(){ineto.value=(Number(ibruto.value||0)-Number(iret.value||0)).toFixed(2)}async function saveInterest(){let b=Number(ibruto.value||0),r=Number(iret.value||0),n=Number(ineto.value||b-r);let {error}=await db.from('intereses_cuentas').insert({user_id:S.user.id,producto_id:iprod.value,fecha:idate.value,importe_bruto:b,retencion:r,importe_neto:n,moneda:'EUR',origen:'manual',observaciones:iobs.value});if(error)alert(error.message);else{closeModal();load()}}
function newEntity(){modal(`<div class="toolbar"><h2>Nueva entidad</h2><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="form"><label>Nombre<input id="enombre"></label><label>Tipo<input id="etipo"></label></div><br><button class="btn" onclick="saveEntity()">Guardar</button>`)}async function saveEntity(){let {error}=await db.from('entidades_financieras').insert({user_id:S.user.id,nombre:enombre.value.trim(),tipo:etipo.value.trim(),activo:true});if(error)alert(error.message);else{closeModal();load()}}
async function setActive(id,active){let {error}=await db.from('productos').update({activo}).eq('id',id).eq('user_id',S.user.id);if(error)alert(error.message);else load()}
function openProduct(id){let p=S.products.find(x=>x.id===id),hist=validRows(id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))),ops=S.ops.filter(o=>o.producto_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));modal(`<div class="toolbar"><div><h2>${esc(p.nombre)}</h2><div class="muted">${esc(entityName(p))} · ${esc(typeName(p))}</div></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div><div class="card"><div class="section-title">Situación actual</div><div class="row"><span>Nº títulos</span><b>${isAccount(p)?'—':num(qtyFor(id))}</b></div><div class="row"><span>Última cotización</span><b>${latestQuote(id)?dateES(latestQuote(id).fecha)+' · '+num(latestQuote(id).cierre)+' €':'—'}</b></div><div class="row"><span>Valor actual</span><b>${money(value(p))}</b></div></div><div class="card"><h3>Histórico de valoraciones</h3><table class="history"><thead><tr><th style="text-align:left">Fecha</th><th>Cantidad</th><th>Cotización</th><th>Total</th><th>Origen</th></tr></thead><tbody>${hist.map(v=>`<tr><td style="text-align:left">${dateES(v.fecha)}</td><td>${num(v.cantidad)}</td><td>${v.precio_unitario==null?'—':num(v.precio_unitario)+' €'}</td><td>${money(v.valor_total)}</td><td>${esc(v.origen||'')}</td></tr>`).join('')||'<tr><td colspan="5">Sin valoraciones.</td></tr>'}</tbody></table></div><div class="card"><h3>Operaciones</h3><table class="history"><thead><tr><th style="text-align:left">Fecha</th><th>Tipo</th><th>Cantidad</th><th>Precio</th></tr></thead><tbody>${ops.map(o=>`<tr><td style="text-align:left">${dateES(o.fecha)}</td><td>${esc(o.tipo_operacion)}</td><td>${num(o.cantidad)}</td><td>${o.precio_unitario==null?'—':money(o.precio_unitario)}</td></tr>`).join('')||'<tr><td colspan="4">Sin operaciones.</td></tr>'}</tbody></table></div>`)}
load().catch(e=>{app.innerHTML='<div class="wrap"><div class="card error"><b>Error al cargar Patrimonio</b><br>'+esc(e.message||e)+'</div></div>'});
</script></body></html>
