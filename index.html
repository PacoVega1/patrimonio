<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b7a">
<title>Patrimonio</title>
<style>
:root{--p:#173b7a;--p2:#2c64c7;--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#687386;--bd:#e1e6ef;--ok:#16803c;--bad:#c62828;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:18px 14px 50px}.hidden{display:none!important}.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #1720330d}.brand{font-size:28px;font-weight:850}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.button{border:0;border-radius:12px;padding:11px 15px;background:var(--p);color:#fff;font-weight:750;cursor:pointer}.button.secondary{background:#fff;color:var(--p);border:1px solid var(--bd)}.button.small{padding:8px 11px;font-size:13px}.button.danger{background:var(--bad)}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}.hero .muted{color:#dbe7ff}.heroValue{font-size:38px;font-weight:850;margin:5px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{padding:14px;border:1px solid var(--bd);border-radius:14px;background:#fff}.hero .box{background:#ffffff18;border-color:#ffffff20}.label{font-size:12px;color:var(--muted)}.hero .label{color:#dbe7ff}.big{font-size:20px;font-weight:800;margin-top:4px}.sectionTitle{font-size:20px;font-weight:850;margin:22px 0 9px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;padding:10px 14px;border:1px solid var(--bd);background:#fff;border-radius:999px;font-weight:750;cursor:pointer}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.search{flex:1;min-width:220px;padding:12px;border:1px solid var(--bd);border-radius:12px}.list{display:grid;gap:9px}.item{padding:14px;border:1px solid var(--bd);border-radius:14px;background:#fff;cursor:pointer}.item:hover{border-color:#b8c8e8}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-weight:800}.muted{color:var(--muted)}.small{font-size:13px}.amount{font-weight:850;white-space:nowrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf3ff;color:#2457b8;font-size:12px;font-weight:750;margin:2px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.login{max-width:430px;margin:12vh auto}.input,.select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:11px;margin-top:8px;background:#fff}.modalBack{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px}.modal h2{margin-top:0}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formFull{grid-column:1/-1}.close{float:right;background:none;border:0;font-size:25px;cursor:pointer}.source{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}.rank{font-weight:850}.empty{text-align:center;padding:25px;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#fff7df;color:#765400;border:1px solid #eed58b}.footer{text-align:center;color:#8a94a5;font-size:12px;margin-top:25px}@media(max-width:700px){.grid,.grid2{grid-template-columns:1fr}.heroValue{font-size:31px}.formGrid{grid-template-columns:1fr}.formFull{grid-column:auto}.row.mobile{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<section id="login" class="card login">
  <div class="brand">Patrimonio</div>
  <p class="muted">Gestión de patrimonio e inversiones</p>
  <input id="email" class="input" type="email" placeholder="Correo electrónico">
  <input id="password" class="input" type="password" placeholder="Contraseña">
  <button id="loginBtn" class="button" style="width:100%;margin-top:10px">Entrar</button>
  <div id="loginMsg" class="small"></div>
</section>

<section id="app" class="hidden">
<header class="top">
  <div><div class="brand">Patrimonio</div><div class="muted small">Tu patrimonio, en un solo lugar</div></div>
  <button id="logout" class="button secondary">Salir</button>
</header>

<div id="main"></div>
<div class="footer">Patrimonio · conectado a Supabase</div>
</section>
</main>
<div id="modalHost"></div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://rnwtvkhnhybdgxhmgebw.supabase.co","sb_publishable_r00Qvz_GBmRi4fVj6O7scA_jIj9wuyN");
const $=id=>document.getElementById(id);
let state={user:null,products:[],entities:[],types:[],portfolios:[],portfolioComponents:[],quotes:[],vals:[],balances:[],sources:[],productSources:[],view:"resumen",filter:"entidades",search:""};

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function euro(v){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(v||0))}
function num(v,d=6){return Number(v||0).toLocaleString("es-ES",{maximumFractionDigits:d})}
function dateES(v){return v?new Date(v+"T00:00:00").toLocaleDateString("es-ES"):""}
function typeName(id){return state.types.find(x=>x.id===id)?.nombre||"Sin categoría"}
function isAccount(p){return /cuenta corriente|cuenta de ahorro|cuenta de inversión/i.test(typeName(p.tipo_producto_id))}
function latest(arr,id){return arr.filter(x=>x.producto_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0]}
function productQuantity(id){
  const ops=state.ops.filter(x=>x.producto_id===id);
  let q=0;
  for(const o of ops){
    const t=(o.tipo_operacion||"").toLowerCase();
    const n=Number(o.cantidad||0);
    if(/venta|salida|traspaso salida|reembolso/.test(t)) q-=n; else if(/compra|entrada|traspaso|dividendo/.test(t)) q+=n;
  }
  return q;
}
function valueOf(p){
  if(isAccount(p)){const b=latest(state.balances,p.id);return Number(b?.saldo||0)}
  const v=latest(state.vals,p.id);
  if(v?.valor_total!=null)return Number(v.valor_total||0);
  const q=latest(state.quotes,p.id);
  return Number(q?.cierre||0)*Math.max(0,productQuantity(p.id));
}
function portfolioValue(id){
  let total=0;
  for(const c of state.portfolioComponents.filter(x=>x.cartera_id===id&&x.activo!==false)){
    const p=state.products.find(p=>p.id===c.producto_id); if(!p) continue;
    const v=latest(state.vals,p.id), q=latest(state.quotes,p.id);
    let val=v?.valor_total!=null?Number(v.valor_total):Number(q?.cierre||0)*Number(c.cantidad||0);
    total+=val;
  }
  return total;
}
function productInPortfolio(id){return state.portfolioComponents.some(c=>c.producto_id===id&&c.activo!==false)}
function totalPatrimonio(){return state.products.filter(p=>!productInPortfolio(p.id)).reduce((s,p)=>s+valueOf(p),0)+state.portfolios.reduce((s,c)=>s+portfolioValue(c.id),0)}
function modal(html){$("modalHost").innerHTML=`<div class="modalBack" id="back"><div class="modal"><button class="close" onclick="closeModal()">×</button>${html}</div></div>`}
window.closeModal=()=>{$("modalHost").innerHTML=""};

async function load(){
  const sess=(await supabase.auth.getSession()).data.session;
  if(!sess){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}
  state.user=sess.user;$("login").classList.add("hidden");$("app").classList.remove("hidden");
  const uid=sess.user.id;
  const [p,e,t,car,cc,q,v,b,s,ps,ops]=await Promise.all([
    supabase.from("productos").select("*").eq("user_id",uid).eq("activo",true).order("nombre"),
    supabase.from("entidades_financieras").select("*").eq("user_id",uid).eq("activo",true).order("nombre"),
    supabase.from("tipos_productos").select("*").eq("activo",true).order("nombre"),
    supabase.from("carteras").select("*").eq("user_id",uid).eq("activa",true).order("nombre"),
    supabase.from("cartera_componentes").select("*").eq("user_id",uid).eq("activo",true),
    supabase.from("cotizaciones_historicas").select("*").eq("user_id",uid).order("fecha",{ascending:false}),
    supabase.from("valoraciones_historicas").select("*").eq("user_id",uid).order("fecha",{ascending:false}),
    supabase.from("v_saldos_historicos").select("*").eq("user_id",uid).order("fecha",{ascending:false}),
    supabase.from("fuentes_valoracion").select("*").eq("activa",true).order("puntuacion",{ascending:false}),
    supabase.from("productos_fuentes").select("*"),
    supabase.from("operaciones").select("*").eq("user_id",uid).order("fecha",{ascending:false})
  ]);
  for(const r of [p,e,t,car,cc,q,v,b,s,ps,ops])if(r.error)throw r.error;
  Object.assign(state,{products:p.data||[],entities:e.data||[],types:t.data||[],portfolios:car.data||[],portfolioComponents:cc.data||[],quotes:q.data||[],vals:v.data||[],balances:b.data||[],sources:s.data||[],productSources:ps.data||[],ops:ops.data||[]});
  render();
}

function shell(active="resumen"){
  const tabs=[["resumen","🏠 Resumen"],["entidades","🏦 Entidades"],["categorias","📊 Categorías"],["biblioteca","📚 Biblioteca"],["fuentes","🌐 Fuentes"]];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${active===k?"active":""}" onclick="go('${k}')">${l}</button>`).join("")}</div>`;
}
window.go=k=>{state.view=k;render()};

function render(){
 const total=totalPatrimonio();
 let body=shell(state.view);
 if(state.view==="resumen")body+=renderResumen(total);
 if(state.view==="entidades")body+=renderEntities();
 if(state.view==="categorias")body+=renderCategories();
 if(state.view==="biblioteca")body+=renderLibrary();
 if(state.view==="fuentes")body+=renderSources();
 $("main").innerHTML=body;
}
function renderResumen(total){
 const accounts=state.products.filter(isAccount).reduce((s,p)=>s+valueOf(p),0);
 const investments=total-accounts;
 const gains=state.products.reduce((s,p)=>s+(Number(valueOf(p))-state.ops.filter(o=>o.producto_id===p.id).reduce((x,o)=>x+Number(o.importe_neto||0),0)),0);
 return `<section class="card hero"><div class="muted">Patrimonio total</div><div class="heroValue">${euro(total)}</div>
 <div class="grid"><div class="box"><div class="label">Cuentas</div><div class="big">${euro(accounts)}</div></div><div class="box"><div class="label">Inversiones</div><div class="big">${euro(investments)}</div></div><div class="box"><div class="label">Productos</div><div class="big">${state.products.length}</div></div></div></section>
 <div class="toolbar"><button class="button" onclick="updateAll()">🔄 Actualizar todo</button><button class="button secondary" onclick="openProduct()">＋ Nuevo producto</button><button class="button secondary" onclick="openEntity()">＋ Nueva entidad</button><input class="search" placeholder="🔎 Buscar producto, ISIN o entidad" value="${esc(state.search)}" oninput="state.search=this.value;renderSearch(this.value)"></div>
 <div id="searchResults"></div>
 <section class="card"><div class="sectionTitle">¿Cómo quieres ver tu patrimonio?</div><div class="grid2"><div class="item" onclick="go('entidades')"><div class="name">🏦 Por entidades</div><div class="muted small">CaixaBank, Bankinter, MyInvestor...</div></div><div class="item" onclick="go('categorias')"><div class="name">📊 Por categorías</div><div class="muted small">Acciones, fondos, planes, cuentas...</div></div></div></section>
 <section class="card"><div class="sectionTitle">Alertas y estado</div>${state.products.filter(p=>!isAccount(p)&&!state.productSources.some(x=>x.producto_id===p.id)).map(p=>`<div class="notice">⚠️ ${esc(p.nombre)} no tiene fuentes asociadas.</div>`).join("")||`<div class="ok">✓ No se han detectado productos sin fuentes asociadas en esta vista.</div>`}</section>`;
}
window.renderSearch=(q)=>{const el=$("searchResults");if(!el)return;const s=q.trim().toLowerCase();if(!s){el.innerHTML="";return}const ps=state.products.filter(p=>(p.nombre+" "+(p.isin||"")+" "+(p.ticker||"")).toLowerCase().includes(s));const es=state.entities.filter(e=>e.nombre.toLowerCase().includes(s));el.innerHTML=`<section class="card"><div class="sectionTitle">Resultados</div>${ps.map(p=>productItem(p)).join("")}${es.map(e=>`<div class="item" onclick="showEntity('${e.id}')"><div class="name">🏦 ${esc(e.nombre)}</div><div class="muted small">Entidad financiera</div></div>`).join("")||(!ps.length?"<div class='empty'>Sin resultados</div>":"")}</section>`};

function productItem(p){
 const src=state.productSources.filter(x=>x.producto_id===p.id).sort((a,b)=>a.prioridad-b.prioridad)[0];
 const f=state.sources.find(x=>x.id===src?.fuente_id);
 return `<div class="item" onclick="showProduct('${p.id}')"><div class="row mobile"><div><div class="name">${esc(p.nombre)}</div><div>${p.isin?`<span class="pill">ISIN ${esc(p.isin)}</span>`:""}${p.ticker?`<span class="pill">${esc(p.ticker)}</span>`:""}<span class="pill">${esc(typeName(p.tipo_producto_id))}</span></div><div class="muted small">${esc(state.entities.find(e=>e.id===p.entidad_financiera_id)?.nombre||"")}</div></div><div class="amount">${euro(valueOf(p))}</div></div>${f?`<div class="muted small">🥇 ${esc(f.nombre)} · prioridad ${src.prioridad}</div>`:""}</div>`;
}
function renderEntities(){
 return `<section class="card"><div class="row"><div><div class="sectionTitle">Entidades</div><div class="muted">Todo lo que tienes en cada entidad.</div></div><button class="button small" onclick="openEntity()">＋ Nueva</button></div><div class="list">${state.entities.map(e=>{const ps=state.products.filter(p=>p.entidad_financiera_id===e.id&&!productInPortfolio(p.id));const val=ps.reduce((s,p)=>s+valueOf(p),0);return `<div class="item" onclick="showEntity('${e.id}')"><div class="row"><div><div class="name">🏦 ${esc(e.nombre)}</div><div class="muted small">${ps.length} productos</div></div><div class="amount">${euro(val)}</div></div></div>`}).join("")}</div></section>`;
}
window.showEntity=id=>{const e=state.entities.find(x=>x.id===id);if(!e)return;const ps=state.products.filter(p=>p.entidad_financiera_id===id);modal(`<h2>${esc(e.nombre)}</h2><div class="muted">Productos y cuentas de esta entidad</div><div class="list" style="margin-top:12px">${ps.map(productItem).join("")||"<div class='empty'>Sin productos</div>"}</div><button class="button" onclick="closeModal();openProduct('${id}')">＋ Añadir producto</button>`)}
function renderCategories(){
 const groups={};state.products.filter(p=>!productInPortfolio(p.id)).forEach(p=>(groups[typeName(p.tipo_producto_id)]??=[]).push(p));
 return `<section class="card"><div class="sectionTitle">Categorías</div><div class="muted">Puedes ver el patrimonio por tipo de producto.</div></section>${Object.entries(groups).map(([k,ps])=>`<section class="card"><div class="row"><div><div class="name">${esc(k)}</div><div class="muted small">${ps.length} productos</div></div><div class="amount">${euro(ps.reduce((s,p)=>s+valueOf(p),0))}</div></div><div class="list" style="margin-top:10px">${ps.map(productItem).join("")}</div></section>`).join("")}`;
}
function renderLibrary(){
 const masters=state.masterProducts||[];
 return `<section class="card"><div class="row"><div><div class="sectionTitle">Biblioteca general de Patrimonio</div><div class="muted">Identidad global del producto. Aquí no se guardan cotizaciones ni valoraciones.</div></div><button class="button small" onclick="openProduct()">＋ Añadir</button></div><div class="notice" style="margin-top:12px">La biblioteca global contiene nombre, ISIN, ticker, tipo, moneda y demás identificadores. Las cotizaciones pertenecen al histórico del producto y las posiciones pertenecen al usuario.</div><div class="toolbar"><input class="search" id="libSearch" placeholder="Buscar por nombre, ISIN o ticker" oninput="renderLibraryList(this.value)"></div><div id="libraryList"></div></section>`;
}
async function renderLibraryList(q=""){
 const r=await supabase.from("productos_maestros").select("*").eq("activo",true).order("nombre"); if(r.error)return;
 state.masterProducts=r.data||[];const s=q.toLowerCase();const arr=state.masterProducts.filter(p=>(p.nombre+" "+(p.isin||"")+" "+(p.ticker||"")).toLowerCase().includes(s));
 $("libraryList").innerHTML=`<div class="list">${arr.map(p=>`<div class="item"><div class="row mobile"><div><div class="name">${esc(p.nombre)}</div><div>${p.isin?`<span class="pill">ISIN ${esc(p.isin)}</span>`:""}${p.ticker?`<span class="pill">${esc(p.ticker)}</span>`:""}<span class="pill">${esc(typeName(p.tipo_producto_id))}</span></div><div class="muted small">${esc(p.moneda||"EUR")} · ${p.verificado?"Verificado":"Pendiente de verificación"}</div></div></div></div>`).join("")||"<div class='empty'>No hay resultados</div>"}</div>`;
}
function renderSources(){
 return `<section class="card"><div class="sectionTitle">Biblioteca de fuentes de cotización</div><div class="muted">Fuentes comunes para todos los usuarios. Se ordenan por calidad y prioridad por producto.</div><div class="list" style="margin-top:12px">${state.sources.map(f=>`<div class="item"><div class="row mobile"><div><div class="name">${esc(f.nombre)}</div><div class="muted small">${esc(f.tipo_fuente||"")} · ${f.gratuita?"Gratuita":"De pago"} · ${f.ofrece_cotizacion_eod?"EOD":""} ${f.ofrece_historico?"· Histórico":""}</div></div><div class="amount">${Number(f.puntuacion||0).toFixed(1)}/10</div></div></div>`).join("")}</div></section>`;
}
async function showProduct(id){
 const p=state.products.find(x=>x.id===id);if(!p)return;
 const srcs=state.productSources.filter(x=>x.producto_id===id).sort((a,b)=>a.prioridad-b.prioridad);
 const sources=srcs.map(s=>state.sources.find(f=>f.id===s.fuente_id)).filter(Boolean);
 const q=latest(state.quotes,id),v=latest(state.vals,id),b=latest(state.balances,id);
 modal(`<h2>${esc(p.nombre)}</h2><div>${p.isin?`<span class="pill">ISIN ${esc(p.isin)}</span>`:""}${p.ticker?`<span class="pill">${esc(p.ticker)}</span>`:""}<span class="pill">${esc(typeName(p.tipo_producto_id))}</span></div><div class="grid2" style="margin-top:12px"><div class="box"><div class="label">Valor actual</div><div class="big">${euro(valueOf(p))}</div></div><div class="box"><div class="label">Último dato</div><div class="big">${dateES(v?.fecha||q?.fecha||b?.fecha)||"—"}</div></div></div><div class="sectionTitle">Fuentes</div>${sources.map((f,i)=>`<div class="source"><span class="rank">${i===0?"🥇":i===1?"🥈":"🥉"} ${esc(f.nombre)}</span><div class="muted small">Puntuación ${Number(f.puntuacion||0).toFixed(1)}/10 · ${f.frecuencia_actualizacion||"frecuencia no indicada"} · ${f.retraso_minutos??"?"} min retraso</div></div>`).join("")||"<div class='notice'>Este producto todavía no tiene fuentes asociadas.</div>"}<div class="toolbar"><button class="button" onclick="closeModal();openProduct('${p.entidad_financiera_id}','${p.id}')">✏️ Editar</button><button class="button secondary" onclick="closeModal();openQuote('${p.id}')">＋ Cotización manual</button><button class="button secondary" onclick="closeModal();openOperation('${p.id}')">＋ Operación</button></div>`);
}
window.showProduct=showProduct;

window.openEntity=async function(){
 modal(`<h2>Nueva entidad</h2><form id="entityForm"><label>Nombre<input class="input" name="nombre" required></label><label>Tipo<select class="select" name="tipo"><option>Banco</option><option>Gestora</option><option>Broker</option><option>Financiera</option><option>Otra</option></select></label><button class="button" style="margin-top:14px;width:100%">Guardar</button></form>`);
 $("entityForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const name=fd.get("nombre").trim();const g=await supabase.rpc("registrar_entidad_global",{p_nombre:name,p_tipo:fd.get("tipo")});if(g.error){alert(g.error.message);return}const ins=await supabase.from("entidades_financieras").insert({user_id:state.user.id,nombre:name,tipo:fd.get("tipo"),activo:true}).select().single();if(ins.error){alert(ins.error.message);return}closeModal();await load()};
}
window.openProduct=async function(entityId="",id=""){
 const p=id?state.products.find(x=>x.id===id):null;
 const types=state.types.filter(t=>!["Cuenta corriente","Cuenta de ahorro","Cuenta de inversión"].includes(t.nombre));
 const entityOptions=state.entities.map(e=>`<option value="${e.id}" ${p?.entidad_financiera_id===e.id||entityId===e.id?"selected":""}>${esc(e.nombre)}</option>`).join("");
 modal(`<h2>${p?"Editar producto":"Nuevo producto"}</h2><form id="productForm"><div class="formGrid"><label>Nombre<input class="input" name="nombre" value="${esc(p?.nombre||"")}" required></label><label>Tipo<select class="select" name="tipo" required>${types.map(t=>`<option value="${t.id}" ${p?.tipo_producto_id===t.id?"selected":""}>${esc(t.nombre)}</option>`).join("")}</select></label><label>ISIN<input class="input" name="isin" value="${esc(p?.isin||"")}"></label><label>Ticker<input class="input" name="ticker" value="${esc(p?.ticker||"")}"></label><label>Moneda<input class="input" name="moneda" value="${esc(p?.moneda||"EUR")}"></label><label>Entidad<select class="select" name="entidad" required>${entityOptions}</select></label></div><div class="notice" style="margin-top:12px">Al crear un producto cotizable, Patrimonio lo incorpora a la biblioteca global. Las cotizaciones no se guardan en la ficha global.</div><button class="button" style="margin-top:14px;width:100%">Guardar</button></form>`);
 $("productForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const data={nombre:fd.get("nombre").trim(),tipo_producto_id:fd.get("tipo"),isin:fd.get("isin").trim()||null,ticker:fd.get("ticker").trim()||null,moneda:fd.get("moneda").trim()||"EUR",entidad_financiera_id:fd.get("entidad"),user_id:state.user.id,activo:true};if(p){const r=await supabase.from("productos").update(data).eq("id",p.id);if(r.error){alert(r.error.message);return}}else{const g=await supabase.rpc("registrar_producto_global",{p_nombre:data.nombre,p_tipo_producto_id:data.tipo_producto_id,p_isin:data.isin,p_ticker:data.ticker,p_moneda:data.moneda});if(g.error){alert(g.error.message);return}data.producto_maestro_id=g.data;const r=await supabase.from("productos").insert(data);if(r.error){alert(r.error.message);return}}closeModal();await load()};
}
window.openQuote=function(id){
 const p=state.products.find(x=>x.id===id);modal(`<h2>Cotización / valoración manual</h2><div class="muted">${esc(p.nombre)}</div><form id="quoteForm"><div class="formGrid"><label>Fecha<input class="input" type="date" name="fecha" required></label><label>Valor unitario<input class="input" type="number" step="0.000001" name="valor" required></label><label class="formFull">Observaciones<textarea class="input" name="obs"></textarea></label></div><button class="button" style="margin-top:14px;width:100%">Guardar</button></form>`);
 $("quoteForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const r=await supabase.from("valoraciones_historicas").insert({user_id:state.user.id,producto_id:id,fecha:fd.get("fecha"),precio_unitario:Number(fd.get("valor")),cantidad:productQuantity(id),valor_total:Number(fd.get("valor"))*Math.max(0,productQuantity(id)),moneda:p.moneda||"EUR",origen:"manual",fuente:"Histórico manual del usuario",observaciones:fd.get("obs")||null});if(r.error){alert(r.error.message);return}closeModal();await load()};
}
window.openOperation=function(id){
 const p=state.products.find(x=>x.id===id);modal(`<h2>Nueva operación</h2><div class="muted">${esc(p.nombre)}</div><form id="opForm"><div class="formGrid"><label>Fecha<input class="input" type="date" name="fecha" required></label><label>Tipo<select class="select" name="tipo"><option>Compra</option><option>Venta</option><option>Traspaso</option><option>Dividendo</option><option>Otro</option></select></label><label>Cantidad<input class="input" type="number" step="0.000001" name="cantidad"></label><label>Precio unitario<input class="input" type="number" step="0.000001" name="precio"></label><label>Gastos<input class="input" type="number" step="0.01" name="gastos" value="0"></label><label>Impuestos<input class="input" type="number" step="0.01" name="impuestos" value="0"></label><label class="formFull">Observaciones<textarea class="input" name="obs"></textarea></label></div><button class="button" style="margin-top:14px;width:100%">Guardar operación</button></form>`);
 $("opForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const qty=Number(fd.get("cantidad")||0),price=Number(fd.get("precio")||0),g=Number(fd.get("gastos")||0),im=Number(fd.get("impuestos")||0);const r=await supabase.from("operaciones").insert({user_id:state.user.id,producto_id:id,fecha:fd.get("fecha"),tipo_operacion:fd.get("tipo"),cantidad:qty,precio_unitario:price,gastos:g,impuestos:im,moneda:p.moneda||"EUR",importe_bruto:qty*price,importe_neto:qty*price+g+im,observaciones:fd.get("obs")||null});if(r.error){alert(r.error.message);return}closeModal();await load()};
}
window.updateAll=async function(){const btn=document.querySelector('.button');try{const r=await supabase.functions.invoke("actualizar-cotizaciones",{body:{}});if(r.error)throw r.error;alert("Actualización terminada. Se recargará el patrimonio.");await load()}catch(e){alert("La actualización no se ha podido completar: "+e.message)}};

$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password){$("loginMsg").textContent="Introduce correo y contraseña.";return}const r=await supabase.auth.signInWithPassword({email,password});if(r.error){$("loginMsg").textContent=r.error.message;return}load()};
$("password").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
$("logout").onclick=async()=>{await supabase.auth.signOut();load()};
load().catch(e=>{console.error(e);$("loginMsg").textContent=e.message});
</script>
</body>
</html>
