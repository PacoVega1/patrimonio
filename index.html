function login(){app.innerHTML='<div class="wrap"><div class="card" style="max-width:430px;margin:100px auto"><h1>Patrimonio</h1><label>Email<input id="em"></label><br><label>Contraseña<input id="pw" type="password"></label><br><button class="btn" onclick="goLogin()">Entrar</button><p id="err"></p></div></div>'}async function goLogin(){let r=await db.auth.signInWithPassword({email:em.value,password:pw.value});if(r.error)err.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';else load()}async function logout(){await db.auth.signOut();S.user=null;login()}

function manualData(id){id=id||S.context||'';modalBox.innerHTML=`<h2>Introducir datos manualmente</h2><div class="sub">${id?'Producto seleccionado: '+esc(S.p.find(x=>x.id===id)?.nombre||''):'Selecciona el producto. Puedes cambiarlo.'}</div><div class="form"><label>Producto<select id="mdp" onchange="manualRefresh()">${active().map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="mdf" type="date" value="${today()}"></label><div id="manualFields" class="full"></div></div><br><button class="btn" onclick="saveManual()">Guardar</button> <button class="btn alt" onclick="closeM()">Cancelar</button>`;manualRefresh();modal.classList.add('open')}
function manualRefresh(){let p=S.p.find(x=>x.id===mdp.value),isA=p&&account(p);manualFields.innerHTML=isA?'<div class="form"><label class="full">Saldo<input id="mdv" type="number" step="0.00000001"></label><label class="full">Observaciones<textarea id="mdo"></textarea></label></div>':'<div class="form"><label>Tipo de dato<select id="mdt"><option value="valoracion">Valoración / valor liquidativo</option><option value="operacion">Operación / aportación</option></select></label><label>Cantidad / participaciones<input id="mdq" type="number" step="0.00000001"></label><label>Precio / valor unitario<input id="mdpu" type="number" step="0.00000001"></label><label>Valor total<input id="mdvt" type="number" step="0.00000001"></label><label class="full">Observaciones<textarea id="mdo"></textarea></label></div>'}
async function saveManual(){let id=mdp.value,fecha=mdf.value,p=S.p.find(x=>x.id===id);if(account(p)){let r=await db.from('valoraciones_historicas').insert({user_id:S.user.id,producto_id:id,fecha,valor_total:Number(mdv.value)||0,origen:'Manual',fuente:'Usuario',es_valida:true,prioridad_origen:100,observaciones:mdo.value});if(r.error)return alert(r.error.message)}else{let total=Number(mdvt.value)||Number(mdq.value)*Number(mdpu.value);if(mdt.value==='operacion'){let r=await db.from('operaciones').insert({user_id:S.user.id,producto_id:id,fecha,tipo_operacion:'Aportación',cantidad:Number(mdq.value)||0,precio_unitario:Number(mdpu.value)||0,importe_neto:total,moneda:'EUR',observaciones:mdo.value});if(r.error)return alert(r.error.message)}else{let r=await db.from('valoraciones_historicas').insert({user_id:S.user.id,producto_id:id,fecha,cantidad:Number(mdq.value)||0,precio_unitario:Number(mdpu.value)||0,valor_total:total,origen:'Manual',fuente:'Usuario',es_valida:true,prioridad_origen:100,observaciones:mdo.value});if(r.error)return alert(r.error.message)}}closeM();load()}
function operationForm(id){modalBox.innerHTML=`<h2>Nueva operación</h2><div class="form"><label>Producto<select id="opP">${active().map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="opF" type="date" value="${today()}"></label><label>Tipo<select id="opT"><option>Compra</option><option>Venta</option><option>Aportación</option><option>Dividendo en acciones</option><option>Acciones liberadas</option><option>Split</option><option>Traspaso</option><option>Ajuste de posición</option><option>Dividendo en efectivo</option><option>Prima de emisión</option><option>Venta de derechos</option></select></label><label>Cantidad<input id="opQ" type="number" step="0.00000001"></label><label>Precio unitario<input id="opPrc" type="number" step="0.00000001"></label><label>Importe neto<input id="opN" type="number" step="0.01"></label><label class="full">Observaciones<textarea id="opO"></textarea></label></div><br><button class="btn" onclick="saveOp()">Guardar</button> <button class="btn alt" onclick="closeM()">Cancelar</button>`;modal.classList.add('open')}
async function saveOp(){let r=await db.from('operaciones').insert({user_id:S.user.id,producto_id:opP.value,fecha:opF.value,tipo_operacion:opT.value,cantidad:Number(opQ.value)||0,precio_unitario:Number(opPrc.value)||0,importe_neto:Number(opN.value)||0,moneda:'EUR',observaciones:opO.value});if(r.error)alert(r.error.message);else{closeM();load()}}
function interestForm(){modalBox.innerHTML=`<h2>Añadir interés</h2><div class="form"><label>Cuenta<select id="ip">${S.p.filter(account).map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="ifd" type="date" value="${today()}"></label><label>Bruto<input id="ib" type="number" step="0.01"></label><label>Retención<input id="ir" type="number" step="0.01"></label><label>Neto<input id="inet" type="number" step="0.01"></label><label class="full">Observaciones<textarea id="io"></textarea></label></div><br><button class="btn" onclick="saveInterest()">Guardar</button> <button class="btn alt" onclick="closeM()">Cancelar</button>`;modal.classList.add('open')}
async function saveInterest(){let b=Number(ib.value)||0,r=Number(ir.value)||0,n=inet.value===''?b-r:Number(inet.value);let x=await db.from('intereses_cuentas').insert({user_id:S.user.id,producto_id:ip.value,fecha:ifd.value,importe_bruto:b,retencion:r,importe_neto:n,moneda:'EUR',origen:'Manual',observaciones:io.value});if(x.error)alert(x.error.message);else{closeM();load()}}
function capture(id){modalBox.innerHTML=`<h2>📎 Añadir documento al producto</h2><div class="notice">El documento queda asociado al producto seleccionado. Se utilizará para extraer los datos de ese producto y proponer una actualización; nunca se modifica la cartera sin tu confirmación.</div><div class="form"><label>Producto<select id="cp">${active().map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label><label>Fecha<input id="cf" type="date" value="${today()}"></label><label class="full">Archivo<input id="file" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv"></label><label class="full">Observaciones<textarea id="co"></textarea></label></div><br><button class="btn" onclick="saveCapture()">Guardar y preparar revisión</button> <button class="btn alt" onclick="closeM()">Cancelar</button>`;modal.classList.add('open')}
async function saveCapture(){let f=document.getElementById('file').files[0];if(!f)return alert('Selecciona un archivo.');let path=S.user.id+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let u=await db.storage.from('patrimonio-documentos').upload(path,f,{upsert:false});if(u.error)return alert(u.error.message);let r=await db.from('documentos_capturas').insert({user_id:S.user.id,producto_id:document.getElementById('cp').value,fecha_documento:document.getElementById('cf').value,archivo_nombre:f.name,archivo_tipo:f.type,archivo_path:path,estado:'pendiente_revision',datos_detectados:{},datos_confirmados:{},observaciones:document.getElementById('co').value});if(r.error)return alert(r.error.message);closeM();load()}
async function activate(id){let r=await db.from('productos').update({activo:true}).eq('id',id).eq('user_id',S.user.id);if(r.error)alert(r.error.message);else load()}async function deactivate(id){if(!confirm('¿Pasar este producto a Inactivos?'))return;let r=await db.from('productos').update({activo:false}).eq('id',id).eq('user_id',S.user.id);if(r.error)alert(r.error.message);else{closeM();load()}}function closeM(){modal.classList.remove('open')}
function render(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><h1>Patrimonio</h1><p>Tu patrimonio, en un solo lugar</p></div><button class="btn alt" onclick="logout()">Salir</button></div><div class="tabs"><button class="tab ${S.tab==='resumen'?'active':''}" onclick="S.tab='resumen';render()">🏠 Resumen</button><button class="tab ${S.tab==='entidades'?'active':''}" onclick="S.tab='entidades';render()">🏦 Entidades</button><button class="tab ${S.tab==='categorias'?'active':''}" onclick="S.tab='categorias';render()">📊 Categorías</button><button class="tab ${S.tab==='biblioteca'?'active':''}" onclick="S.tab='biblioteca';render()">📚 Biblioteca</button><button class="tab ${S.tab==='inactivos'?'active':''}" onclick="S.tab='inactivos';render()">📁 Inactivos</button><button class="tab ${S.tab==='intereses'?'active':''}" onclick="S.tab='intereses';render()">💶 Intereses</button><button class="tab ${S.tab==='fuentes'?'active':''}" onclick="S.tab='fuentes';render()">🌐 Fuentes</button></div>${S.tab==='resumen'?summary():S.tab==='entidades'?entities():S.tab==='categorias'?categories():S.tab==='biblioteca'?library():S.tab==='inactivos'?inactive():S.tab==='intereses'?interests():sources()}</div>`}
window.addEventListener('error',e=>{document.getElementById('app').innerHTML='<div class="wrap"><div class="card error"><h2>Error de JavaScript</h2><p>'+esc(e.message||'Error desconocido')+'</p></div></div>'});load();
</script></body></html>
