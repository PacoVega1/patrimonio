<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrimonio</title>
<style>
:root{--b:#234b86;--bg:#f4f7fb;--c:#fff;--t:#17243d;--m:#71809a;--l:#d9e2ee;--g:#16834b;--r:#c43b32;--w:#8a6919}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t)}
.wrap{max-width:1450px;margin:auto;padding:22px}.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 6px 20px #17243d0a}.error{padding:13px;border-radius:11px;background:#fff0ef;color:var(--r)}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card"><h1>Patrimonio</h1><p>Cargando...</p></div></div></div>
<div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div>
<script>
window.addEventListener('error',function(e){
  var a=document.getElementById('app');
  if(a){a.innerHTML='<div class="wrap"><div class="card error"><h2>No se ha podido cargar Patrimonio</h2><p>'+String(e.message||'Error desconocido')+'</p></div></div>';}
});
function cargarPatrimonio(){
  var s=document.createElement('script');
  s.src='./app.js?v=20260825-0300';
  s.onload=function(){
    var y=document.createElement('script');
    y.src='./yahoo-sync.js?v=20260825-0300';
    document.body.appendChild(y);
  };
  s.onerror=function(){
    document.getElementById('app').innerHTML='<div class="wrap"><div class="card error"><h2>No se ha podido cargar Patrimonio</h2><p>No se pudo cargar app.js.</p></div></div>';
  };
  document.body.appendChild(s);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="cargarPatrimonio()" onerror="document.getElementById('app').innerHTML='<div class=&quot;wrap&quot;><div class=&quot;card error&quot;><h2>No se ha podido cargar Patrimonio</h2><p>No se pudo cargar la biblioteca de Supabase.</p></div></div>'"></script>
</body>
</html>
