<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrimonio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#214889;--bg:#f4f6fb;--c:#fff;--t:#14213d;--m:#71809b;--l:#dfe5ef;--g:#198754;--r:#c0392b;--w:#765c13}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;color:var(--t)}.wrap{max-width:1380px;margin:auto;padding:24px}.top,.entity-head,.product,.row{display:flex;justify-content:space-between;gap:15px}.top{align-items:center}.brand h1{margin:0;font-size:34px}.brand p,.meta,.muted{color:var(--m)}button,input,select{font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--b);color:#fff}.btn.secondary{background:#fff;color:var(--b);border:1px solid var(--l)}.tabs,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--l);background:#fff;border-radius:28px;padding:11px 18px;font-weight:800;cursor:pointer}.tab.active{background:var(--b);color:#fff}.hero{background:linear-gradient(135deg,#204784,#3269c9);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.total{font-size:48px;font-weight:900;margin:5px 0 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#ffffff24;padding:15px;border-radius:14px}.stat b{display:block;font-size:21px;margin-top:5px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 5px 18px #14213d0a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.search{flex:1;min-width:260px;padding:12px 15px;border:1px solid var(--l);border-radius:12px;background:#fff}.row{align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.entity-head{align-items:center;padding:17px 0;border-bottom:1px solid var(--l);cursor:pointer}.entity-name{font-size:20px;font-weight:850}.entity-total{font-size:20px;font-weight:900;white-space:nowrap}.entity-products{padding:0 0 12px 20px}.product{align-items:center;padding:15px 0;border-bottom:1px solid var(--l);cursor:pointer}.product .name{font-weight:850}.value{font-weight:900;font-size:19px;text-align:right;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3ff;color:#2459b0;font-size:12px;font-weight:800;margin:2px}.ok{background:#eaf7ef;color:#176b42}.warn{background:#fff7df;color:var(--w)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--l);font-size:14px}th{color:var(--m)}.bar{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#3269c9}.modal{position:fixed;inset:0;background:#0a142080;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:920px;width:100%;max-height:90vh;overflow:auto;padding:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-weight:700;font-size:13px}.form input,.form select{width:100%;margin-top:5px;padding:11px;border:1px solid var(--l);border-radius:10px}.full{grid-column:1/-1}.notice{padding:14px;border-radius:12px;background:#fff7df;color:var(--w);margin:12px 0}.error{background:#fff0ef;color:#9c2c20}.empty{text-align:center;padding:30px;color:var(--m)}@media(max-width:850px){.stats,.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:14px}.stats,.grid{grid-template-columns:1fr}.total{font-size:38px}.entity-head,.product{display:block}.value{margin-top:8px;text-align:left}}</style></head><body><div id="app"></div><div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div></div></div><script>
const SUPABASE_URL="https://rnwtvkhnhybdgxhmgebw.supabase.co",SUPABASE_KEY="sb_publishable_r00Qvz_GBmRi4fVj6O7scA_jIj9wuyN",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let state={user:null,products:[],entities:[],types:[],ops:[],valuations:[],quotes:[],tab:"entidades",search:"",expanded:{}};
const money=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n)||0),dateES=d=>d?new Intl.DateTimeFormat("es-ES").format(new Date(d+"T00:00:00")):"—",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function typeName(p){return state.types.find(t=>t.id===p.tipo_producto_id)?.nombre||"Sin categoría"}function entityName(p){return state.entities.find(e=>e.id===p.entidad_financiera_id)?.nombre||"Sin entidad"}function isAccount(p){return ["Cuenta corriente","Cuenta de ahorro","Cuenta de inversión"].includes(typeName(p))}function opSign(o){return /venta|retirada|salida/i.test(o.tipo_operacion||"")?-1:1}function qtyFor(id){return state.ops.filter(o=>o.producto_id===id).reduce((s,o)=>s+opSign(o)*Number(o.cantidad||0),0)}function latest(a,key){let m={};for(const x of a)if(!m[x[key]]||String(x.fecha)>String(m[x[key]].fecha))m[x[key]]=x;return m}function latestVal(id){return latest(state.valuations,"producto_id")[id]}function latestQuote(id){return latest(state.quotes,"producto_id")[id]}function fresh(d,n){if(!d)return false;let x=new Date(d+"T00:00:00"),now=new Date();return x<=now&&((now-x)/86400000)<=n}
function value(p){let v=latestVal(p.id);if(isAccount(p))return v?.valor_total!=null?Number(v.valor_total):0;if(v?.valor_total!=null&&fresh(v.fecha,45))return Number(v.valor_total);let q=latestQuote(p.id),qty=qtyFor(p.id);return q?.cierre!=null&&fresh(q.fecha,10)&&qty?Number(q.cierre)*qty*Number(q.factor_conversion||1):0}
function status(p){let v=latestVal(p.id),q=latestQuote(p.id);if(isAccount(p))return v?`saldo ${dateES(v.fecha)}`:"sin saldo";if(q&&fresh(q.fecha,10))return `cotización ${dateES(q.fecha)}`;if(v&&fresh(v.fecha,45))return `valoración ${dateES(v.fecha)}`;if(q)return `cotización antigua ${dateES(q.fecha)}`;if(v)return `valoración antigua ${dateES(v.fecha)}`;return "sin valoración actual"}
function badge(p){let v=latestVal(p.id),q=latestQuote(p.id);if(isAccount(p))return v?`<span class="badge ok">Saldo ${dateES(v.fecha)}</span>`:`<span class="badge warn">Sin saldo</span>`;if(q&&fresh(q.fecha,10))return `<span class="badge ok">Cotización ${dateES(q.fecha)}</span>`;if(v&&fresh(v.fecha,45))return `<span class="badge ok">Valoración ${dateES(v.fecha)}</span>`;return `<span class="badge warn">Sin valoración actual</span>`}
async function pagedQuotes(uid){let all=[],from=0,step=1000;while(true){let {data,error}=await db.from("cotizaciones_historicas").select("*").eq("user_id",uid).order("fecha",{ascending:false}).range(from,from+step-1);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<step)break;from+=step}return all}
async function load(){let {data:{user},error}=await db.auth.getUser();if(error)throw error;state.user=user;if(!user){loginView();return}let uid=user.id;let results=await Promise.all([db.from("productos").select("*").eq("user_id",uid),db.from("entidades_financieras").select("*").eq("user_id",uid),db.from("tipos_productos").select("*").eq("activo",true).order("orden_presentacion"),db.from("operaciones").select("*").eq("user_id",uid).order("fecha"),db.from("valoraciones_historicas").select("*").eq("user_id",uid).order("fecha"),pagedQuotes(uid)]);let names=["products","entities","types","ops","valuations","quotes"];for(let i=0;i<results.length;i++){if(results[i].error)throw results[i].error;state[names[i]]=results[i].data||results[i]||[]}render()}
function loginView(){app.innerHTML=`<div class="wrap"><div class="card" style="max-width:420px;margin:100px auto"><h1>Patrimonio</h1><div class="form"><label class="full">Email<input id="email" type="email"></label><label class="full">Contraseña<input id="password" type="password"></label></div><br><button class="btn" onclick="login()">Entrar</button><p id="msg"></p></div></div>`}async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.innerHTML=`<span class="error">${esc(error.message)}</span>`;else load()}async function logout(){await db.auth.signOut();load()}
function groups(){let g={};state.products.slice().sort((a,b)=>entityName(a).localeCompare(entityName(b),"es")||typeName(a).localeCompare(typeName(b),"es")||a.nombre.localeCompare(b.nombre,"es")).forEach(p=>(g[entityName(p)]??=[]).push(p));return g}function total(){return state.products.reduce((s,p)=>s+value(p),0)}function filtered(ps){let q=state.search.toLowerCase().trim();return q?ps.filter(p=>(p.nombre+" "+(p.isin||"")+" "+(p.ticker||"")+" "+entityName(p)).toLowerCase().includes(q)):ps}
function productCard(p){let q=qtyFor(p.id),v=value(p);return `<div class="product" onclick="openProduct('${p.id}')"><div><div class="name">${esc(p.nombre)}</div><span class="badge">${esc(typeName(p))}</span>${p.isin?`<span class="badge">ISIN ${esc(p.isin)}</span>`:""}${p.ticker?`<span class="badge">${esc(p.ticker)}</span>`:""}<div class="meta">${esc(status(p))}</div></div><div class="value">${isAccount(p)||v?money(v):"—"}${badge(p)}<div class="meta">${q?esc(q.toLocaleString("es-ES",{maximumFractionDigits:8}))+" títulos":""}</div></div></div>`}
function entitiesView(){let g=groups();return `<div class="card"><div class="section-title"><h2>Entidades</h2><button class="btn secondary" onclick="newEntity()">＋ Nueva entidad</button></div><p class="muted">Las entidades aparecen contraídas. Pulsa una para desplegar todos sus productos.</p>${Object.entries(g).map(([e,ps])=>{let open=!!state.expanded[e],tot=ps.reduce((s,p)=>s+value(p),0);return `<div class="entity-head" onclick="toggleEntity(${JSON.stringify(e)})"><div><div><span>${open?"▼":"▶"}</span> <span class="entity-name">${esc(e)}</span></div><div class="meta">${ps.length} producto${ps.length===1?"":"s"}</div></div><div class="entity-total">${money(tot)}</div></div>${open?`<div class="entity-products">${filtered(ps).map(productCard).join("")||empty()}</div>`:""}`}).join("")||empty()}</div>`}
function summary(){let g=groups();return `<div class="hero"><small>Patrimonio total</small><div class="total">${money(total())}</div><div class="stats"><div class="stat">Cuentas<b>${money(state.products.filter(isAccount).reduce((s,p)=>s+value(p),0))}</b></div><div class="stat">Inversiones<b>${money(state.products.filter(p=>!isAccount(p)).reduce((s,p)=>s+value(p),0))}</b></div><div class="stat">Productos<b>${state.products.length}</b></div><div class="stat">Entidades<b>${Object.keys(g).length}</b></div></div></div><div class="actions"><button class="btn" onclick="load()">🔄 Actualizar</button><input class="search" placeholder="🔎 Buscar producto, ISIN o entidad" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div><div class="card"><h2>Estado de valoración</h2><p>Las cotizaciones se cargan por páginas y ordenadas de más reciente a más antigua, evitando que Supabase entregue solo las primeras cotizaciones históricas y termine usando 2003 como valor actual.</p><p class="muted">Las cotizaciones antiguas no se utilizan para calcular el patrimonio actual.</p></div>`}
function toggleEntity(e){state.expanded[e]=!state.expanded[e];render()}function empty(){return `<div class="empty">No hay datos para mostrar.</div>`}function render(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><h1>Patrimonio</h1><p>Tu patrimonio, en un solo lugar</p></div><button class="btn secondary" onclick="logout()">Salir</button></div><div class="tabs"><button class="tab ${state.tab==='resumen'?'active':''}" onclick="state.tab='resumen';render()">🏠 Resumen</button><button class="tab ${state.tab==='entidades'?'active':''}" onclick="state.tab='entidades';render()">🏛️ Entidades</button></div>${state.tab==='resumen'?summary():entitiesView()}</div>`}
function accountHistory(id){let h=state.valuations.filter(v=>v.producto_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));return `<h3>Histórico de saldo</h3>${h.length?`<table><thead><tr><th>Fecha</th><th>Saldo</th><th>Diferencia</th></tr></thead><tbody>${h.map((v,i)=>{let old=h[i+1],d=old?Number(v.valor_total||0)-Number(old.valor_total||0):null;return `<tr><td>${dateES(v.fecha)}</td><td>${money(v.valor_total)}</td><td style="font-weight:800;color:${d>0?'var(--g)':d<0?'var(--r)':'inherit'}">${d==null?'—':(d>=0?'+':'')+money(d)}</td></tr>`}).join("")}</tbody></table>`:empty()}`}
function openProduct(id){let p=state.products.find(x=>x.id===id),v=value(p),q=latestQuote(id),lv=latestVal(id),ops=state.ops.filter(o=>o.producto_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));document.getElementById("modalContent").innerHTML=`<div class="top"><div><h2>${esc(p.nombre)}</h2><div class="meta">${esc(entityName(p))} · ${esc(typeName(p))}</div></div><button class="btn secondary" onclick="closeModal()">Cerrar</button></div>${isAccount(p)?accountHistory(id):`<p><span class="badge">Posición ${qtyFor(id).toLocaleString("es-ES",{maximumFractionDigits:8})}</span> <span class="badge">${v?money(v):"Sin valoración actual"}</span></p><h3>Operaciones</h3><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Títulos</th><th>Precio</th></tr></thead><tbody>${ops.map(o=>`<tr><td>${dateES(o.fecha)}</td><td>${esc(o.tipo_operacion)}</td><td>${Number(o.cantidad||0).toLocaleString("es-ES",{maximumFractionDigits:8})}</td><td>${money(o.precio_unitario)}</td></tr>`).join("")}</tbody></table>${q?`<p class="muted">Última cotización: ${dateES(q.fecha)} · ${Number(q.cierre).toLocaleString("es-ES",{maximumFractionDigits:6})}</p>`:""}${lv?`<p class="muted">Última valoración: ${dateES(lv.fecha)} · ${money(lv.valor_total)}</p>`:""}${!q||!fresh(q.fecha,10)?`<div class="notice">No se utiliza una cotización antigua para el valor actual.</div>`:""}`}`;modal.classList.add("open")}
function closeModal(){modal.classList.remove("open")}
function newEntity(){modalContent.innerHTML=`<h2>Nueva entidad</h2><div class="form"><label>Nombre<input id="enombre"></label><label>Tipo<input id="etipo" placeholder="Banco, broker..."></label></div><br><button class="btn" onclick="saveEntity()">Guardar</button> <button class="btn secondary" onclick="closeModal()">Cancelar</button>`;modal.classList.add("open")}async function saveEntity(){let nombre=enombre.value.trim(),tipo=etipo.value.trim();if(!nombre)return alert("Indica el nombre.");let {error}=await db.from("entidades_financieras").insert({user_id:state.user.id,nombre,tipo,activo:true});if(error)alert(error.message);else{closeModal();load()}}
load().catch(e=>{app.innerHTML=`<div class="wrap"><div class="card error"><h2>Error al cargar Patrimonio</h2><p>${esc(e.message||e)}</p><button class="btn" onclick="load()">Reintentar</button></div></div>`});</script></body></html>
